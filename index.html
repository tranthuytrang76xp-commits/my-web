<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS 7.0 Tutor – Learning English with Ms. Trang Tran</title>
<style>
/* =====================================================================
   IELTS 7.0 TUTOR — Learning English with Ms. Trang Tran
   Giai đoạn 1: Khung giao diện + Trang chủ + Từ vựng + Tiến độ
   ===================================================================== */
:root{
  --fs:1;
  --bg:#f2f5f9; --surface:#ffffff; --surface2:#eef2f7; --text:#1d2939; --muted:#5f6f85;
  --primary:#1d5fbf; --primary2:#2f7de1; --primary-soft:#e4eefb; --border:#d9e1ec;
  --ok:#15803d; --ok-soft:#e3f4e8; --warn:#b45309; --warn-soft:#fdf1df; --bad:#c62828; --bad-soft:#fde7e7;
  --gray:#94a3b8; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e1620; --surface:#16212f; --surface2:#1d2a3b; --text:#e5ecf4; --muted:#9aabc0;
  --primary:#5c9df2; --primary2:#7db1f5; --primary-soft:#1a3150; --border:#2a3a4f;
  --ok:#4ade80; --ok-soft:#173225; --warn:#fbbf24; --warn-soft:#3a2d12; --bad:#f87171; --bad-soft:#3b1c1c;
  --gray:#53657c; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Verdana,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* ---------- Sidebar ---------- */
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px calc(14px + env(safe-area-inset-bottom))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;display:block}
.brand b{display:block;font-size:1rem}
.brand small{color:var(--muted);font-size:.72rem;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-size:.95rem}
.nav a:hover{background:var(--surface2)}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav a .soon{margin-left:auto;font-size:.65rem;background:var(--surface2);color:var(--muted);padding:2px 7px;border-radius:20px;font-weight:400}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--border)}
.save-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray);margin-right:6px;vertical-align:middle}
.save-dot.cloud{background:var(--ok)} .save-dot.local{background:var(--warn)}
/* ---------- Main ---------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 24px 12px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mlogo{display:none}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;min-width:38px;height:38px;padding:0 9px;display:inline-grid;place-items:center;font-weight:700;font-size:.85rem}
.iconbtn:hover{border-color:var(--primary);color:var(--primary)}
.iconbtn svg{width:18px;height:18px}
#view{padding:22px 24px 30px;max-width:1100px;width:100%;margin:0 auto;flex:1}
.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:14px 16px 22px;border-top:1px solid var(--border)}
.footer b{color:var(--primary)}
/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .topbar .mlogo{display:block;width:36px;height:36px}
  #view{padding:16px 14px 24px}
  .footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.68rem;padding:4px 0;border-radius:10px}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a.active{color:var(--primary);font-weight:700}
}
/* ---------- Components ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin:0 0 12px}
.card h3{font-size:.95rem;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid transparent;background:var(--primary);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:8px}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn)}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.75rem;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.chip.blue{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.chip.green{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.amber{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.red{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .4s}
textarea,input[type=text],select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 12px;outline:none}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:96px;resize:vertical}
.notice{border-radius:12px;padding:12px 14px;font-size:.88rem;border:1px solid var(--border);background:var(--surface2)}
.notice.info{background:var(--primary-soft);border-color:transparent}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.notice.ok{background:var(--ok-soft);border-color:transparent}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{margin:0;font-size:1.08rem}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:none;padding:0;margin-bottom:12px;font-size:.9rem}
.back:hover{color:var(--primary)}
/* Home */
.hero{background:linear-gradient(135deg,#1d5fbf 0%,#3a6ea8 55%,#5b7593 100%);color:#fff;border:none}
.hero .muted{color:rgba(255,255,255,.82)}
.hero h2{font-size:1.35rem;margin:0 0 4px}
.goalnum{font-size:2.6rem;font-weight:700;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.5rem}
.stat span{font-size:.78rem;color:var(--muted)}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.task + .task{margin-top:8px}
.task .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.locked{opacity:.6}
.task .ttl{font-weight:700;font-size:.93rem}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:.75rem;line-height:1.15}
.ring .lbl b{font-size:1.25rem;display:block}
/* Vocab */
.topic{cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.topic:hover{transform:translateY(-2px);border-color:var(--primary)}
.topic .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--primary-soft);margin-bottom:10px}
.word{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.word + .word{margin-top:8px}
.word-head{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.word-head .w{font-weight:700;font-size:1.02rem}
.word-head .ipa{color:var(--muted);font-size:.85rem}
.word-body{display:none;padding:0 14px 14px;border-top:1px dashed var(--border)}
.word.open .word-body{display:block}
.ex{border-left:3px solid var(--primary);padding:6px 10px;margin:10px 0;background:var(--surface2);border-radius:0 8px 8px 0}
.ex .vi{color:var(--muted);font-size:.88rem;font-style:italic}
.col{display:flex;gap:8px;align-items:baseline;font-size:.9rem;margin:4px 0}
.col b{color:var(--primary)}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--gray)}
.status-dot.learning{background:var(--warn)} .status-dot.known{background:var(--primary2)} .status-dot.mastered{background:var(--ok)}
.speak{border:1px solid var(--border);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;color:var(--primary)}
.speak:hover{background:var(--primary-soft)}
.speak svg{width:17px;height:17px}
/* Flashcard */
.fc-wrap{perspective:1200px;max-width:620px;margin:0 auto}
.fc{position:relative;min-height:330px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;overflow:auto}
.fc-front{align-items:center;justify-content:center;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-front .w{font-size:2.1rem;font-weight:700;color:var(--primary)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:620px;margin:16px auto 0}
.grade .btn{flex-direction:column;gap:0;padding:10px 4px}
.grade .btn small{font-weight:400;font-size:.72rem;opacity:.9}
/* AI result */
.err{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--surface)}
.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;padding:0 4px;border-radius:4px}
.right{background:var(--ok-soft);color:var(--ok);padding:0 4px;border-radius:4px;font-weight:700}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* Progress charts */
.chart text{fill:var(--muted);font-size:11px;font-family:Tahoma,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.skillrow{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;padding:7px 0}
.skillrow .pbar{height:12px}
.mistake{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface)}
.mistake + .mistake{margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:.82rem}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 14px;font-size:1.1rem}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--surface);padding:8px}
.seg button.on{background:var(--primary);color:#fff;font-weight:700}
input[type=range]{width:100%;accent-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d2939;color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){.toast{bottom:calc(90px + env(safe-area-inset-bottom))}}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem}
/* ---------- GĐ2: Writing & Speaking ---------- */
.stepper{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:128px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;font-size:.8rem}
.step span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;flex:none}
.step em{font-style:normal}
.step.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.step.on span{background:var(--primary);color:#fff}
.step.done span{background:var(--ok);color:#fff}
.prompt-text{background:var(--surface2);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
details.pd>summary{cursor:pointer;font-weight:700;list-style:none}
details.pd>summary::-webkit-details-marker{display:none}
details.pd>summary::after{content:" ▾";color:var(--muted)}
.sec-block{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.qs{margin:6px 0 8px;padding-left:20px;color:var(--muted);font-size:.85rem}
.ai-fb{display:flex;gap:8px;background:var(--primary-soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.ai-fb svg{width:18px;height:18px;flex:none;color:var(--primary);margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:6px}
.vchip{border:1px solid var(--border);border-radius:10px;padding:8px 40px 8px 10px;display:flex;flex-direction:column;gap:2px;position:relative;background:var(--surface)}
.vchip b{color:var(--primary)} .vchip span{font-size:.85rem} .vchip small{color:var(--muted);font-size:.75rem}
.vchip .speak{position:absolute;right:6px;top:8px;width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sent{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.sent .num{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.iconbtn.sm{min-width:28px;height:28px;padding:0 6px;font-size:.75rem}
.pending{border:2px solid var(--primary);border-radius:12px;padding:12px 14px;background:var(--surface)}
textarea.para{min-height:130px;line-height:1.7}
.essay{background:var(--surface2);border-radius:12px;padding:6px 18px;margin:10px 0;line-height:1.8}
.result{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.bigband{font-size:3rem;font-weight:700;line-height:1;min-width:90px;text-align:center}
.crit{padding:10px 0;border-bottom:1px dashed var(--border)}
.bandpill{color:#fff;border-radius:8px;padding:1px 9px;font-weight:700;font-size:.85rem}
.blist{margin:6px 0;padding-left:20px} .blist li{margin:3px 0}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:14px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);margin:14px 0}
.timer .tnum{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:100px}
.timer.prep{background:var(--warn-soft)} .timer.speak{background:var(--primary-soft)}
.timer.ok .tnum{color:var(--ok)} .timer.over .tnum{color:var(--bad)}
.cue{background:var(--surface2);border-radius:12px;padding:12px 16px;margin-top:10px}
.cue ul{margin:6px 0 0;padding-left:20px}
.qbig{font-size:1.25rem;font-weight:700;margin:10px 0}
.btn.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.better{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.88rem}
@media (max-width:600px){.better{grid-template-columns:1fr}}
.qgroup{margin-bottom:22px}
.qinstr{font-size:.85rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-style:italic}
.hbox{border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
.qitem{padding:10px 0;border-bottom:1px dashed var(--border);line-height:1.9}
.qnum{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:.8rem;margin-right:8px;line-height:1}
.qitem.right .qnum{background:var(--ok);color:#fff} .qitem.wrongq .qnum{background:var(--bad);color:#fff}
.gapin{display:inline-block;width:160px;max-width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin:0 4px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px;line-height:1.5}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--primary)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt.correct{border-color:var(--ok)!important;background:var(--ok-soft)!important} .opt.chosen-wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.tfng{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;line-height:1.4}
.tfng label{border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.8rem;cursor:pointer;background:var(--surface);position:relative}
.tfng input{position:absolute;opacity:0;pointer-events:none}
.tfng label:has(input:checked){background:var(--primary);color:#fff;border-color:var(--primary)}
.tfng label.correct{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important} .tfng label.chosen-wrong{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.explain{margin-top:8px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.88rem;line-height:1.6}
.evid{margin-top:8px;border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-soft);border-radius:0 8px 8px 0}
.summary-text{line-height:2.3;margin-bottom:6px}
.passage p{margin:0 0 14px;line-height:1.8}
.passage .pl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--primary);color:#fff;font-weight:700;font-size:.8rem;margin-right:8px}
.passage .s{transition:background .3s}
.passage .s.hl{background:#ffe58a;color:#1d2939;border-radius:4px;box-shadow:0 0 0 2px #ffe58a}
.vi-block{display:block;margin-top:6px;color:var(--muted);font-size:.88rem;font-style:italic;border-left:3px solid var(--border);padding-left:10px}
.rsplit{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.rsplit .passage-col{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.mtabs{display:none}
@media (max-width:900px){.rsplit{grid-template-columns:1fr}.rsplit .passage-col{position:static;max-height:none}.rsplit.show-q .passage-col{display:none}.rsplit.show-p .q-col{display:none}
 .mtabs{display:flex;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:6;background:var(--bg);padding:6px 0}}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tline{padding:6px 10px;border-radius:8px;margin:2px 0;line-height:1.7} .tline.hl{background:var(--warn-soft)} .tline .who{font-weight:700;color:var(--primary);margin-right:6px}
.tline .vi{display:block;color:var(--muted);font-size:.85rem;font-style:italic}
.kbd{font-size:.72rem;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--muted)}

  { id:"l2-farm", part:"Part 2", title:"A welcome talk at a community farm", minutes:7,
    context_vi:"Một hướng dẫn viên giới thiệu với du khách về Nông trại Cộng đồng Greenfield.",
    speakers:{ T:{name:"Tom (guide)",gender:"m"} },
    script:[
      {s:"T",t:"Good morning, everyone, and welcome to Greenfield Community Farm. My name is Tom, and I'll be your guide today.",vi:"Chào buổi sáng mọi người, chào mừng đến với Nông trại Cộng đồng Greenfield. Tôi tên là Tom, và hôm nay tôi sẽ là hướng dẫn viên của các bạn."},
      {s:"T",t:"The farm was set up in nineteen ninety-eight by a group of local parents who wanted their children to understand where food comes from.",vi:"Nông trại được thành lập năm 1998 bởi một nhóm phụ huynh địa phương, những người muốn con mình hiểu thực phẩm đến từ đâu."},
      {s:"T",t:"Today we have around two hundred volunteers, and most of them are retired people who live in the nearby villages.",vi:"Hiện nay chúng tôi có khoảng hai trăm tình nguyện viên, và phần lớn là người đã nghỉ hưu sống ở các làng lân cận."},
      {s:"T",t:"Let me quickly explain the layout. We're standing in the courtyard, right next to the shop.",vi:"Để tôi giải thích nhanh sơ đồ. Chúng ta đang đứng ở sân trong, ngay cạnh cửa hàng."},
      {s:"T",t:"If you walk straight ahead, you'll reach the vegetable gardens. Please stay on the paths there, as the soil is very wet at this time of year.",vi:"Nếu đi thẳng về phía trước, các bạn sẽ đến khu vườn rau. Xin hãy đi trên lối đi ở đó, vì đất rất ướt vào thời điểm này trong năm."},
      {s:"T",t:"To your left is the animal barn. Visitors are welcome to feed the goats, but we ask you not to feed the pigs, because they're on a special diet.",vi:"Bên trái các bạn là chuồng gia súc. Du khách có thể cho dê ăn, nhưng chúng tôi đề nghị không cho lợn ăn vì chúng đang theo chế độ ăn đặc biệt."},
      {s:"T",t:"The café is behind the barn. It used to be the farmhouse kitchen, and it's now famous for its homemade apple cake.",vi:"Quán cà phê nằm phía sau chuồng. Trước đây nó là gian bếp của trang trại, và giờ nổi tiếng với món bánh táo tự làm."},
      {s:"T",t:"Now, a few changes this season. The tractor ride used to be free, but we now charge two pounds per person, and all the money goes towards repairing the old greenhouse.",vi:"Giờ là vài thay đổi trong mùa này. Chuyến đi xe máy kéo trước đây miễn phí, nhưng giờ chúng tôi thu hai bảng mỗi người, và toàn bộ số tiền được dùng để sửa nhà kính cũ."},
      {s:"T",t:"Also, the farm now closes at five o'clock instead of six, because we've had problems finding enough evening staff.",vi:"Ngoài ra, nông trại giờ đóng cửa lúc năm giờ thay vì sáu giờ, vì chúng tôi gặp khó khăn trong việc tìm đủ nhân viên làm buổi tối."},
      {s:"T",t:"Finally, if you'd like to come back, our most popular event is the Harvest Festival, which takes place on the last weekend of September.",vi:"Cuối cùng, nếu các bạn muốn quay lại, sự kiện được yêu thích nhất của chúng tôi là Lễ hội Mùa gặt, diễn ra vào cuối tuần cuối cùng của tháng Chín."},
      {s:"T",t:"Tickets usually sell out quickly, so I'd recommend booking at least a month in advance.",vi:"Vé thường bán hết rất nhanh, nên tôi khuyên các bạn đặt trước ít nhất một tháng."},
      {s:"T",t:"Right, if you have any questions, just ask me or any of the staff in green jackets. Enjoy your visit!",vi:"Được rồi, nếu có câu hỏi gì, cứ hỏi tôi hoặc bất kỳ nhân viên nào mặc áo khoác xanh lá. Chúc các bạn tham quan vui vẻ!"}

  { id:"l3-roofs", part:"Part 4", title:"A lecture on green roofs", minutes:8,
    context_vi:"Một giảng viên trình bày về mái nhà xanh trong đô thị: lịch sử, lợi ích, hạn chế và chính sách.",
    speakers:{ L:{name:"Lecturer",gender:"f"} },
    script:[
      {s:"L",t:"Today I'd like to talk about green roofs, which are roofs partly or completely covered with plants.",vi:"Hôm nay tôi muốn nói về mái nhà xanh — những mái nhà được phủ cây xanh một phần hoặc toàn bộ."},
      {s:"L",t:"Although they may seem like a modern idea, green roofs have a long history. In Scandinavia, people covered their houses with grass for hundreds of years to keep them warm in winter.",vi:"Dù có vẻ là ý tưởng hiện đại, mái nhà xanh có lịch sử lâu đời. Ở bán đảo Scandinavia, người ta phủ cỏ lên nhà suốt hàng trăm năm để giữ ấm vào mùa đông."},
      {s:"L",t:"The modern green roof movement, however, began in Germany in the nineteen seventies, and today around ten percent of German roofs are green.",vi:"Tuy nhiên, phong trào mái nhà xanh hiện đại bắt đầu ở Đức vào thập niên 1970, và ngày nay khoảng mười phần trăm mái nhà ở Đức là mái xanh."},
      {s:"L",t:"So why are cities interested in them? The first benefit is temperature. In summer, a green roof can be up to forty degrees cooler than a traditional dark roof.",vi:"Vậy tại sao các thành phố quan tâm đến chúng? Lợi ích đầu tiên là nhiệt độ. Vào mùa hè, mái nhà xanh có thể mát hơn tới bốn mươi độ so với mái tối màu truyền thống."},
      {s:"L",t:"This reduces the need for air conditioning, and studies suggest that energy use in the building below can fall by around a quarter.",vi:"Điều này giảm nhu cầu dùng điều hoà, và các nghiên cứu cho thấy năng lượng tiêu thụ của toà nhà bên dưới có thể giảm khoảng một phần tư."},
      {s:"L",t:"The second benefit relates to water. In heavy rain, ordinary roofs send all the water straight into the drains, which can cause flooding.",vi:"Lợi ích thứ hai liên quan đến nước. Khi mưa lớn, mái nhà thông thường đẩy toàn bộ nước thẳng xuống cống, có thể gây ngập lụt."},
      {s:"L",t:"A green roof, by contrast, can hold up to seventy percent of the rainwater, releasing it slowly over several hours.",vi:"Ngược lại, mái nhà xanh có thể giữ tới bảy mươi phần trăm lượng nước mưa và nhả ra từ từ trong vài giờ."},
      {s:"L",t:"Thirdly, green roofs support wildlife. Researchers in London found that they attract bees and rare spiders, even on buildings that are twenty storeys high.",vi:"Thứ ba, mái nhà xanh hỗ trợ động vật hoang dã. Các nhà nghiên cứu ở London phát hiện chúng thu hút ong và những loài nhện quý hiếm, ngay cả trên toà nhà cao hai mươi tầng."},
      {s:"L",t:"Of course, there are drawbacks. The main one is cost: installing a green roof is roughly twice as expensive as a conventional roof.",vi:"Tất nhiên cũng có hạn chế. Hạn chế chính là chi phí: lắp đặt mái nhà xanh đắt gần gấp đôi mái thông thường."},
      {s:"L",t:"Older buildings may also need to be strengthened, because wet soil is surprisingly heavy.",vi:"Các toà nhà cũ cũng có thể cần được gia cố, vì đất ướt nặng đến bất ngờ."},
      {s:"L",t:"However, a green roof usually lasts much longer, because the plants protect the waterproof layer from sunlight.",vi:"Tuy nhiên, mái nhà xanh thường bền hơn nhiều, vì cây cối bảo vệ lớp chống thấm khỏi ánh nắng mặt trời."},
      {s:"L",t:"In my view, the most effective policy is the one used in Toronto, where all new large buildings are required by law to include a green roof.",vi:"Theo tôi, chính sách hiệu quả nhất là chính sách ở Toronto, nơi luật pháp yêu cầu mọi toà nhà lớn mới xây phải có mái nhà xanh."},
      {s:"L",t:"Next week, we'll look at vertical gardens, which bring similar ideas to the walls of buildings.",vi:"Tuần sau, chúng ta sẽ tìm hiểu về vườn đứng — đưa những ý tưởng tương tự lên tường của các toà nhà."}
    ],
    groups:[
      { type:"gap", title:"Questions 1–6 · Notes: Green roofs", instr:"Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.", items:[
        {n:1,q:"History: in Scandinavia, grass roofs kept houses ___ in winter.",a:["warm"],ev:[1],ex:"'covered their houses with grass ... to keep them warm in winter' → warm."},
        {n:2,q:"The modern movement began in ___ in the 1970s.",a:["Germany"],ev:[2],ex:"'The modern green roof movement, however, began in Germany in the 1970s' → Germany. Bẫy: Scandinavia là nơi có TRUYỀN THỐNG lâu đời; 'however' báo hiệu chuyển sang phong trào HIỆN ĐẠI."},
        {n:3,q:"Energy: use in the building can fall by about a ___.",a:["quarter"],ev:[4],ex:"'energy use ... can fall by around a quarter' → quarter (một phần tư). Bẫy: 'forty degrees' là mức chênh lệch nhiệt độ, không phải mức giảm năng lượng."},
        {n:4,q:"Water: a green roof can hold up to ___% of rainwater.",a:["70","seventy"],ev:[6],ex:"'can hold up to seventy percent of the rainwater' → 70."},

        {n:6,q:"Older buildings may need strengthening because wet ___ is heavy.",a:["soil"],ev:[9],ex:"'Older buildings may also need to be strengthened, because wet soil is surprisingly heavy' → soil."}

  { id:"r2-sleep", title:"Sleep and the Teenage Brain", minutes:20, level:"Academic · Passage 2",
    paras:{
      A:[["For decades, parents and teachers assumed that teenagers who stayed up late and struggled to get up in the morning were simply lazy.","Trong nhiều thập kỷ, cha mẹ và giáo viên cho rằng những thiếu niên thức khuya và khó dậy vào buổi sáng chỉ đơn giản là lười biếng."],

         ["When school starts early, the result is a chronic lack of sleep: one American survey found that fewer than a third of high school students regularly slept for eight hours.","Khi giờ học bắt đầu sớm, hậu quả là tình trạng thiếu ngủ kéo dài: một khảo sát ở Mỹ cho thấy chưa đến một phần ba học sinh trung học thường xuyên ngủ đủ tám tiếng."]],

         ["Students who are deprived of sleep therefore find it harder to remember what they have learned.","Vì vậy, học sinh bị thiếu ngủ sẽ khó ghi nhớ những gì đã học hơn."],

/* =====================================================================
   STATE & STORAGE
   ===================================================================== */
const LS_KEY = 'ielts7-tutor-state-v1';
function defaultState(){
  return { v:1, updatedAt:0,
    settings:{ theme:'auto', fs:1, rate:0.9, voice:'' },
    cards:{},          // wordId -> {ease, interval, due, reps, lapses, first, last}
    activity:{},       // 'YYYY-MM-DD' -> {cards, newWords, sentences, review, min}
    mistakes:[],       // {id, src, type, wrong, fix, explain, sentence, corrected, date, reviews, mastered}
    sentences:[],      // {id, wordId, text, corrected, score, date}
    scores:{ writing:[], speaking:[], listening:[], reading:[] }, // {band,date,...}
    writing:{ drafts:{}, history:[] },
    speaking:{ history:[] },
    listening:{ history:[] },
    reading:{ history:[] }
  };
}
let S = defaultState();
let cloud = { ref:null, status:'init', writing:false, pending:false, timer:null };

function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ return mergeState(JSON.parse(raw)); } }catch(e){}
  return null;
}
function mergeState(obj){
  const d=defaultState();
  if(!obj||typeof obj!=='object') return d;
  const o=Object.assign(d,obj);
  o.settings=Object.assign(defaultState().settings,obj.settings||{});
  o.scores=Object.assign(defaultState().scores,obj.scores||{});
  o.writing=Object.assign({drafts:{},history:[]},obj.writing||{});
  o.speaking=Object.assign({history:[]},obj.speaking||{});
  o.listening=Object.assign({history:[]},obj.listening||{});
  o.reading=Object.assign({history:[]},obj.reading||{});
  return o;
}
function save(){
  S.updatedAt=Date.now();
  if(S.mistakes.length>300) S.mistakes=S.mistakes.slice(-300);
  if(S.sentences.length>150) S.sentences=S.sentences.slice(-150);
  if(S.writing.history.length>12) S.writing.history=S.writing.history.slice(-12);
  if(S.speaking.history.length>30) S.speaking.history=S.speaking.history.slice(-30);
  if(S.listening.history.length>40) S.listening.history=S.listening.history.slice(-40);
  if(S.reading.history.length>40) S.reading.history=S.reading.history.slice(-40);
  ['writing','speaking','listening','reading'].forEach(k=>{ if(S.scores[k].length>60) S.scores[k]=S.scores[k].slice(-60); });
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(cloud.ref){ clearTimeout(cloud.timer); cloud.timer=setTimeout(pushCloud,1200); }
}
async function pushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){ cloud.pending=true; return; }
  cloud.writing=true;
  try{
    await cloud.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt });
    setSaveStatus('cloud');
  }catch(e){
    if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){ cloud.ref=null; setSaveStatus('local'); }
    else setSaveStatus('local');
  }
  cloud.writing=false;
  if(cloud.pending){ cloud.pending=false; pushCloud(); }
}
function setSaveStatus(s){
  cloud.status=s;
  const el=document.getElementById('saveStatus');
  if(!el) return;
  el.innerHTML = s==='cloud' ? '<span class="save-dot cloud"></span>Tiến độ được lưu lâu dài'
    : s==='local' ? '<span class="save-dot local"></span>Đang lưu trên trình duyệt này'
    : '<span class="save-dot"></span>Đang kết nối bộ lưu trữ…';
}
async function initCloud(){
  if(!(window.claude && typeof window.claude.use==='function')){ setSaveStatus('local'); return; }
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){ setSaveStatus('local'); return; }
    const id=await user.id();
    if(!id){ setSaveStatus('local'); return; }
    const ref=db.doc('data/users/'+id+'/state');
    let timedOut=false;
    const t=setTimeout(()=>{timedOut=true; setSaveStatus('local');},10000);
    const snap=await ref.get();
    clearTimeout(t);
    cloud.ref=ref;
    if(snap.exists){
      const d=snap.data();
      let remote=null; try{ remote=JSON.parse(d.json); }catch(e){}
      if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
        S=mergeState(remote);
        try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
        applySettings(); render();
        toast('Đã đồng bộ tiến độ của bạn ☁️');
      } else if((S.updatedAt||0) > (remote&&remote.updatedAt||0)){ pushCloud(); }
    } else if(S.updatedAt){ pushCloud(); }
    setSaveStatus('cloud');
  }catch(e){ setSaveStatus('local'); }
}

/* =====================================================================
   AI (Claude trong artifact)
   ===================================================================== */
let AI = { fn:null, ready:false, checked:false };
async function initAI(){
  if(!(window.claude && typeof window.claude.use==='function')){ AI.checked=true; setAIStatus(); return; }
  try{ AI.fn=await claude.use('sample'); }catch(e){ AI.fn=null; }
  AI.ready=!!AI.fn; AI.checked=true; setAIStatus();
}
function setAIStatus(){
  const el=document.getElementById('aiStatus');
  if(el) el.innerHTML = AI.ready ? '<span class="save-dot cloud"></span>Gia sư AI sẵn sàng' : (AI.checked ? '<span class="save-dot"></span>AI chưa khả dụng ở chế độ xem này':'');
}
function extractJSON(text){
  if(!text) throw new Error('empty');
  let t=text.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<0) throw new Error('nojson');
  return JSON.parse(t.slice(a,b+1));
}
async function askAI(prompt){
  if(!AI.fn) throw {code:'unavailable_ai'};
  const res = await AI.fn(prompt, { modelTier:'default', cache:false });
  return extractJSON(res && res.text);
}
function aiErrorMsg(e){
  const c=e&&e.code;
  if(c==='not_granted'){ AI.ready=false; AI.fn=null; setAIStatus(); return 'Bạn chưa cho phép trang dùng gia sư AI. Có thể bật lại khi mở trang lần sau.'; }
  if(c==='rate_limited') return 'Gia sư AI đang được dùng nhiều quá — bạn đợi khoảng một phút rồi bấm “Thử lại” nhé.';
  if(c==='unavailable_ai') return 'Gia sư AI chưa khả dụng ở chế độ xem này. Bạn hãy mở trang trong Claude để dùng tính năng chấm/sửa.';
  return 'Ôi, gia sư AI chưa trả lời được lần này (mạng chập chờn hoặc phản hồi bị lỗi). Bạn bấm “Thử lại” nhé — câu của bạn vẫn còn nguyên.';
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
function dkey(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function act(k=dkey()){ return Object.assign({cards:0,newWords:0,sentences:0,review:0,wsent:0,essays:0,spk:0,lis:0,rea:0,min:0}, S.activity[k]||{}); }
function logAct(field,n,minutes){
  const k=dkey(); const a=act(k); a[field]=(a[field]||0)+n; a.min=Math.round(((a.min||0)+minutes)*10)/10; S.activity[k]=a; save();
}
function streak(){
  let n=0; let d=new Date();
  if(!(act(dkey(d)).min>0)) d=new Date(Date.now()-DAY);
  while(act(dkey(d)).min>0){ n++; d=new Date(d.getTime()-DAY); }
  return n;
}
function allWords(){ const out=[]; VOCAB_TOPICS.forEach(t=>t.words.forEach((w,i)=>out.push(Object.assign({id:t.id+'-'+i,topic:t.id},w)))); return out; }
let WORDS=[]; let WMAP={};
function indexWords(){ WORDS=allWords(); WMAP={}; WORDS.forEach(w=>WMAP[w.id]=w); }
function wstatus(id){ const c=S.cards[id]; if(!c) return 'new'; if(c.interval>=21) return 'mastered'; if(c.interval>=7) return 'known'; return 'learning'; }
const STATUS_VI={new:'Chưa học',learning:'Đang học',known:'Đã thuộc',mastered:'Thành thạo'};
function dueIds(topic){ const now=Date.now(); return Object.keys(S.cards).filter(id=>WMAP[id] && (!topic||WMAP[id].topic===topic) && S.cards[id].due<=now); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- Speech (speechSynthesis, ưu tiên en-GB) ---------- */
let VOICES=[];
function loadVoices(){ try{ VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)); }catch(e){ VOICES=[]; } }
function pickVoice(){
  if(S.settings.voice){ const v=VOICES.find(v=>v.name===S.settings.voice); if(v) return v; }
  return VOICES.find(v=>/en[-_]GB/i.test(v.lang)) || VOICES.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('Trình duyệt này chưa hỗ trợ giọng đọc.'); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
    u.rate=S.settings.rate||0.9;
    speechSynthesis.speak(u);
  }catch(e){ toast('Không phát được âm thanh.'); }
}
function speakId(id, part){ const w=WMAP[id]; if(!w) return; speak(part==='ex'?w.ex:w.w); }

/* ---------- Theme & font ---------- */
function applySettings(){
  const th=S.settings.theme==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : S.settings.theme;
  document.documentElement.setAttribute('data-theme',th);
  document.documentElement.style.setProperty('--fs',S.settings.fs);
  $('#themeBtn').innerHTML = th==='dark'?I.sun:I.moon;
}
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); S.settings.theme = cur==='dark'?'light':'dark'; applySettings(); save(); }
function changeFont(d){ S.settings.fs=Math.min(1.35,Math.max(0.85,Math.round((S.settings.fs+d*0.05)*100)/100)); applySettings(); save(); }

/* =====================================================================
   ROUTER
   ===================================================================== */
let route='home';
let V = { mode:'topics', topic:null, session:null, sentence:null, filter:'all' }; // vocab sub-state
let P = { mfilter:'all', reviewIdx:null, reveal:false }; // progress sub-state
function go(r){ if(location.hash!=='#'+r) location.hash=r; else onRoute(); }
function onRoute(){
  const h=(location.hash||'').replace('#','');
  route = TITLES[h] ? h : 'home';
  if(route!=='vocab' && V.mode==='flash') V.mode='topics';
  if(route!=='listening') lStopAudio();
  if(route!=='reading') rStopTimer();
  if(route!=='speaking'){ stopTimer(); if(DICT && dictState==='listening'){ try{ DICT.stop().catch(()=>{}); }catch(e){} } }
  render(); window.scrollTo(0,0);
}
function render(){
  document.querySelectorAll('[data-r]').forEach(a=>{
    const r=a.getAttribute('data-r');
    a.classList.toggle('active', r===route || (r==='practice' && ['writing','speaking','listening','reading'].includes(route)));
  });
  $('#pageTitle').textContent=TITLES[route];
  const v=$('#view');
  if(route==='home') v.innerHTML=renderHome();
  else if(route==='vocab') v.innerHTML=renderVocab();
  else if(route==='progress') v.innerHTML=renderProgress();
  else if(route==='practice') v.innerHTML=renderPractice();
  else if(route==='writing') v.innerHTML=renderWriting();
  else if(route==='speaking') v.innerHTML=renderSpeaking();
  else if(route==='listening') v.innerHTML=renderListening();
  else if(route==='reading') v.innerHTML=renderReading();
  else v.innerHTML=renderSoon(route);
  afterRender();
}
function afterRender(){
  const ta=document.getElementById('sentInput');
  if(ta && V.sentence && V.sentence.draft!=null) ta.value=V.sentence.draft;
  if(route==='speaking') { updateTimerUI(); updateMicBtn(); }
}

/* =====================================================================
   HOME
   ===================================================================== */
function todayPlan(){
  const a=act(); const due=dueIds().length; const hasNew = WORDS.some(w=>!S.cards[w.id]);
  const activeMistakes=S.mistakes.filter(m=>!m.mastered).length;
  return [
    {key:'review', ttl:'Ôn flashcard đến hạn', desc: due>0?`${due} thẻ đang chờ bạn ôn`:'Không còn thẻ đến hạn — tuyệt!', min:4,
      done: due===0 || a.cards-a.newWords>=15, action:"startFlash(null)", cta:'Ôn ngay'},
    {key:'new', ttl:'Học 5 từ mới', desc:`Hôm nay đã học ${a.newWords} từ mới`, min:3,
      done: a.newWords>=5 || !hasNew, action:"startFlash(null)", cta:'Học từ mới'},
    {key:'sent', ttl:'Đặt 2 câu với từ mới — AI sửa', desc:`Đã viết ${a.sentences}/2 câu`, min:3,
      done: a.sentences>=2, action:"openSentence(null)", cta:'Viết câu'},
    {key:'write', ttl:'Writing: viết 3 câu cho bài luận', desc:`Đã viết ${a.wsent}/3 câu hôm nay${wContinueHint()}`, min:6,
      done: a.wsent>=3 || a.essays>=1, action:"wQuickStart()", cta:'Viết tiếp'},
    {key:'speak', ttl:'Speaking: trả lời 2 câu hỏi', desc:`Đã trả lời ${a.spk}/2 câu`, min:4,
      done: a.spk>=2, action:"spRandom()", cta:'Luyện nói'},
    {key:'mist', ttl:'Ôn lại sổ lỗi hay mắc', desc: activeMistakes?`${activeMistakes} lỗi cần ôn lại`:'Chưa có lỗi nào trong sổ', min:2,
      done: a.review>=3 || activeMistakes===0, action:"go('progress')", cta:'Mở sổ lỗi'},
    lrItem(a)
  ];
}
function lrItem(a){
  const lisDay = new Date().getDate()%2===0;
  return lisDay

function topicStats(t){
  const ids=t.words.map((w,i)=>t.id+'-'+i);
  const c={new:0,learning:0,known:0,mastered:0}; ids.forEach(id=>c[wstatus(id)]++);
  c.learned=ids.length-c.new; c.total=ids.length; c.due=dueIds(t.id).length; return c;
}

/* ---------- Flashcards (SRS) ---------- */
function startFlash(topic){
  const due=dueIds(topic).sort((a,b)=>S.cards[a].due-S.cards[b].due).slice(0,30);
  const newLeft=Math.max(0, CONFIG.newWordsPerDay - act().newWords);
  const fresh=WORDS.filter(w=>!S.cards[w.id] && (!topic||w.topic===topic)).slice(0,newLeft).map(w=>w.id);
  const queue=[...due,...fresh];
  V.mode='flash'; V.topic=topic;
  V.session={queue, idx:0, flipped:false, done:0, again:0, total:queue.length, topic, startAt:Date.now(), requeued:{}};
  if(route!=='vocab') go('vocab'); else render();
  window.scrollTo(0,0);
}
function endFlash(){ V.mode = V.session && V.session.topic ? 'topic':'topics'; V.topic=V.session&&V.session.topic; V.session=null; render(); }
function renderFlash(){
  const s=V.session;
  if(!s) { V.mode='topics'; return renderVocab(); }
  if(s.idx>=s.queue.length){
    return `<button class="back" onclick="endFlash()">${I.back} Quay lại</button>
    <div class="card empty">
      <div class="big">${s.total?'🎉':'✅'}</div>
      <h2>${s.total?'Hoàn thành phiên ôn tập!':'Hiện chưa có thẻ nào cần ôn'}</h2>
      <p class="muted">${s.total?`Bạn đã ôn ${s.done} lượt thẻ. Hệ thống đã lên lịch ôn lại phù hợp cho từng từ.`:`Bạn đã học đủ ${CONFIG.newWordsPerDay} từ mới hôm nay hoặc mọi thẻ đều chưa đến hạn. Hãy thử tự đặt câu với từ vừa học!`}</p>
      <div class="row" style="justify-content:center"><button class="btn" onclick="openSentence(null${s.topic?`,'${s.topic}'`:''})">${I.pen} Đặt câu với từ vừa học</button><button class="btn ghost" onclick="go('home');V.mode='topics';V.session=null">Về trang chủ</button></div>
    </div>`;
  }
  const id=s.queue[s.idx]; const w=WMAP[id]; const isNew=!S.cards[id];
  const c=S.cards[id];
  const prev=k=>{ const n=previewInterval(c,k); return n<1?'<1 phút':n===1?'1 ngày':n+' ngày'; };
  return `
  <div class="row" style="margin-bottom:12px"><button class="back" style="margin:0" onclick="endFlash()">${I.back} Kết thúc</button><span class="spacer"></span><span class="chip blue">${s.idx+1}/${s.queue.length}</span>${isNew?'<span class="chip amber">Từ mới</span>':'<span class="chip">Ôn lại</span>'}</div>
  <div class="pbar" style="max-width:620px;margin:0 auto 16px"><i style="width:${Math.round(s.idx/s.queue.length*100)}%"></i></div>
  <div class="fc-wrap">
    <div class="fc ${s.flipped?'flipped':''}" onclick="flipCard()">
      <div class="fc-face fc-front">
        <div class="w">${esc(w.w)}</div>
        <div class="muted" style="margin:6px 0">${esc(w.ipa)} · <i>${esc(w.pos)}</i></div>
        <button class="speak" style="width:46px;height:46px" onclick="event.stopPropagation();speakId('${id}')" aria-label="Nghe">${I.sound}</button>
        <div class="muted small" style="margin-top:22px">Bạn có nhớ nghĩa không? Nhấn vào thẻ để lật <span class="kbd">Space</span></div>
      </div>
      <div class="fc-face fc-back">
        <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><div style="font-size:1.3rem;font-weight:700;color:var(--primary)">${esc(w.w)}</div><div class="muted small">${esc(w.ipa)} · ${esc(w.pos)}</div></div><button class="speak" onclick="event.stopPropagation();speakId('${id}','ex')" aria-label="Nghe ví dụ">${I.sound}</button></div>
        <div style="font-size:1.1rem;font-weight:700;margin-top:10px">${esc(w.vi)}</div>
        <div class="ex"><div>${esc(w.ex)}</div><div class="vi">${esc(w.exVi)}</div></div>
        ${w.col.map(c=>`<div class="col"><b>${esc(c[0])}</b><span class="muted">— ${esc(c[1])}</span></div>`).join('')}
      </div>
    </div>
  </div>
  ${s.flipped?`
  <div class="grade">
    <button class="btn bad" onclick="gradeCard(0)">Quên<small>${prev(0)}</small></button>
    <button class="btn warn" onclick="gradeCard(1)">Khó<small>${prev(1)}</small></button>
    <button class="btn" onclick="gradeCard(2)">Nhớ<small>${prev(2)}</small></button>
    <button class="btn ok" onclick="gradeCard(3)">Dễ<small>${prev(3)}</small></button>
  </div><div class="muted tiny" style="text-align:center;margin-top:8px">Phím tắt: 1 · 2 · 3 · 4</div>`
  :`<div style="text-align:center;margin-top:16px"><button class="btn" onclick="flipCard()">Lật thẻ xem nghĩa</button></div>`}
  `;
}
function flipCard(){ if(!V.session) return; V.session.flipped=!V.session.flipped; render(); }
function nextIntervalCalc(c,g){
  c=c||{ease:2.5,interval:0,reps:0};
  let ease=c.ease, interval=c.interval, reps=c.reps;
  if(g===0){ return {ease:Math.max(1.3,ease-0.2),interval:0,reps:0}; }
  if(g===1){ interval = reps===0?1:Math.max(1,Math.round(interval*1.2)); ease=Math.max(1.3,ease-0.15); }
  if(g===2){ interval = reps===0?1: reps===1?3: Math.max(interval+1,Math.round(interval*ease)); }
  if(g===3){ interval = reps===0?3: Math.max(interval+2,Math.round(interval*ease*1.3)); ease=ease+0.15; }
  return {ease,interval,reps:reps+1};
}
function previewInterval(c,g){ return nextIntervalCalc(c,g).interval; }
function gradeCard(g){
  const s=V.session; if(!s||!s.flipped) return;
  const id=s.queue[s.idx]; const old=S.cards[id]; const isNew=!old;
  const r=nextIntervalCalc(old,g);
  const card=Object.assign({lapses:0,first:dkey()},old||{},r,{last:Date.now()});
  if(g===0){ card.lapses=(card.lapses||0)+1; card.due=Date.now()+60000; if(!s.requeued[id]){ s.queue.push(id); s.requeued[id]=1; } }
  else card.due=Date.now()+r.interval*DAY;
  S.cards[id]=card;
  if(isNew) logAct('newWords',1,0.6);
  logAct('cards',1,0.4);
  s.done++; s.idx++; s.flipped=false;
  render();
}
document.addEventListener('keydown',e=>{
  if(route!=='vocab'||V.mode!=='flash'||!V.session) return;
  if(/input|textarea|select/i.test((e.target.tagName||''))) return;
  if(e.code==='Space'){ e.preventDefault(); flipCard(); }
  if(V.session.flipped && ['1','2','3','4'].includes(e.key)) gradeCard(+e.key-1);
});

/* ---------- Sentence practice (AI sửa) ---------- */
function openSentence(wordId, topic){
  let id=wordId;
  if(!id){
    // ưu tiên từ đã học gần đây, chưa đặt câu nhiều
    const pool=WORDS.filter(w=>S.cards[w.id] && (!topic||w.topic===topic));
    const used={}; S.sentences.forEach(x=>used[x.wordId]=(used[x.wordId]||0)+1);
    const cand=(pool.length?pool:WORDS.filter(w=>!topic||w.topic===topic)).slice().sort((a,b)=>(used[a.id]||0)-(used[b.id]||0)||((S.cards[b.id]||{}).last||0)-((S.cards[a.id]||{}).last||0));
    id=cand[0]?cand[0].id:WORDS[0].id;
  }
  V.mode='sentence'; V.sentence={wordId:id, topic, draft:'', result:null, loading:false, error:null};
  if(route!=='vocab') go('vocab'); else render();
  window.scrollTo(0,0);
}
function pickSentenceWord(sel){ V.sentence={wordId:sel.value, topic:V.sentence.topic, draft:'', result:null, loading:false, error:null}; render(); }
function renderSentence(){
  const s=V.sentence; const w=WMAP[s.wordId];
  const pool=WORDS.filter(x=>!s.topic||x.topic===s.topic);
  const history=S.sentences.filter(x=>x.wordId===s.wordId).slice(-3).reverse();
  return `
  <button class="back" onclick="V.mode=V.sentence&&V.sentence.topic?'topic':'topics';V.topic=V.sentence&&V.sentence.topic;render()">${I.back} Quay lại</button>

      </div>
      <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><div style="font-size:1.35rem;font-weight:700;color:var(--primary)">${esc(w.w)}</div><div class="muted small">${esc(w.ipa)} · ${esc(w.pos)} · ${esc(w.vi)}</div></div><button class="speak" onclick="speakId('${w.id}')">${I.sound}</button></div>
      <div class="ex"><div>${esc(w.ex)}</div><div class="vi">${esc(w.exVi)}</div></div>
      ${w.col.map(c=>`<div class="col"><b>${esc(c[0])}</b><span class="muted">— ${esc(c[1])}</span></div>`).join('')}
      <div class="notice info small" style="margin-top:12px">💡 Mẹo band 7: thử dùng kèm một collocation ở trên, và viết câu có 2 mệnh đề (because / although / which…).</div>
    </div>
    <div class="card">
      <h2>✍️ Câu của bạn</h2>
      <textarea id="sentInput" placeholder="Viết một câu tiếng Anh có dùng “${esc(w.w)}”…" oninput="V.sentence.draft=this.value"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="checkSentence()" ${s.loading?'disabled':''}>${s.loading?'<span class="spinner"></span> Gia sư đang đọc…':I.spark+' AI sửa & giải thích'}</button>
        <span class="muted tiny">AI chỉ sửa tối thiểu, giữ ý của bạn.</span>

function renderSentResult(r){
  const sc=Math.max(0,Math.min(10,Number(r.score)||0));

  return `
  <div style="margin-top:16px">
    <div class="row"><span class="chip ${color}">Điểm câu: ${sc}/10</span>${r.correct?'<span class="chip green">Câu đúng ngữ pháp</span>':''}${r.usedTarget===false?'<span class="chip red">Chưa dùng đúng từ mục tiêu</span>':''}</div>
    ${r.comment?`<p class="small">${esc(r.comment)}</p>`:''}
    ${!r.correct&&r.corrected?`<div class="small" style="font-weight:700">Câu đã sửa</div><div class="ex"><div>${esc(r.corrected)}</div></div>`:''}
    ${(r.errors||[]).length?`<div class="small" style="font-weight:700;margin-top:8px">Lỗi & giải thích</div>${r.errors.map(e=>`
      <div class="err"><span class="chip">${esc(e.type||'Lỗi')}</span>
        <div style="margin:6px 0"><span class="wrong">${esc(e.wrong)}</span> → <span class="right">${esc(e.fix)}</span></div>
        <div class="small">${esc(e.explain)}</div></div>`).join('')}
      <div class="muted tiny" style="margin-top:6px">📒 Các lỗi trên đã được lưu vào “Sổ lỗi hay mắc” để bạn ôn lại.</div>`:''}
    ${r.upgrade?`<div class="small" style="font-weight:700;margin-top:12px">Gợi ý nâng cấp band 7+</div>
      <div class="ex" style="border-color:var(--ok)"><div class="row" style="flex-wrap:nowrap;gap:8px"><div style="flex:1">${esc(r.upgrade)}</div><button class="speak" style="width:28px;height:28px" data-t="${esc(r.upgrade)}" onclick="speak(this.dataset.t)">${I.sound}</button></div>${r.upgrade_vi?`<div class="vi">${esc(r.upgrade_vi)}</div>`:''}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="V.sentence.result=null;V.sentence.draft='';render();setTimeout(()=>{const t=document.getElementById('sentInput');t&&t.focus()},50)">Viết câu khác</button><button class="btn sm soft" onclick="nextSentenceWord()">Từ tiếp theo →</button></div>
  </div>`;
}
function nextSentenceWord(){ const cur=V.sentence; const pool=WORDS.filter(x=>!cur.topic||x.topic===cur.topic); const i=pool.findIndex(x=>x.id===cur.wordId); V.sentence={wordId:pool[(i+1)%pool.length].id, topic:cur.topic, draft:'', result:null, loading:false, error:null}; render(); }
async function checkSentence(){
  const s=V.sentence; const w=WMAP[s.wordId];
  const ta=document.getElementById('sentInput'); const text=(ta?ta.value:s.draft||'').trim();
  s.draft=text;
  if(text.split(/\s+/).filter(Boolean).length<3){ toast('Bạn viết một câu hoàn chỉnh (ít nhất 3 từ) nhé.'); return; }
  s.loading=true; s.error=null; s.result=null; render();
  const prompt=`Bạn là giáo viên IELTS người Việt, tận tâm và khích lệ. Học viên (mục tiêu IELTS band 7.0) vừa đặt một câu tiếng Anh để luyện từ "${w.w}" (${w.pos}, nghĩa: ${w.vi}).
Câu của học viên: """${text}"""

Nhiệm vụ:
1. Kiểm tra ngữ pháp, chính tả, dấu câu, cách dùng từ, collocation, và học viên có dùng đúng từ "${w.w}" (đúng nghĩa, đúng từ loại) hay không.
2. Sửa TỐI THIỂU, giữ nguyên ý của học viên. Không viết lại thành câu khác.
3. Giải thích từng lỗi bằng tiếng Việt, ngắn gọn, dễ hiểu (vì sao sai, quy tắc đúng).
4. Đưa một phiên bản nâng cấp tự nhiên ở mức band 7+ (vẫn giữ ý chính), kèm dịch nghĩa tiếng Việt.

Chỉ trả về DUY NHẤT một đối tượng JSON hợp lệ, không thêm chữ nào khác, theo mẫu:
{"correct": true/false, "usedTarget": true/false, "score": số từ 0 đến 10, "corrected": "câu đã sửa tối thiểu (giống câu gốc nếu không có lỗi)", "errors": [{"type": "Ngữ pháp | Từ vựng | Collocation | Chính tả | Dấu câu | Dùng từ mục tiêu", "wrong": "đoạn sai nguyên văn", "fix": "đoạn đúng", "explain": "giải thích tiếng Việt"}], "upgrade": "câu nâng cấp band 7+", "upgrade_vi": "dịch nghĩa câu nâng cấp", "comment": "1-2 câu nhận xét tiếng Việt, khích lệ"}
Nếu câu không có lỗi thì "errors" là mảng rỗng.`;
  try{
    const r=await askAI(prompt);
    s.result=r; s.loading=false;
    const today=dkey();
    S.sentences.push({id:'s'+Date.now(), wordId:w.id, text, corrected:r.corrected||text, score:Number(r.score)||0, date:today});
    (r.errors||[]).forEach((e,i)=>{ if(e&&e.wrong&&e.fix) S.mistakes.push({id:'m'+Date.now()+'_'+i, src:'Từ vựng', word:w.w, type:e.type||'Khác', wrong:e.wrong, fix:e.fix, explain:e.explain||'', sentence:text, corrected:r.corrected||'', date:today, reviews:0, mastered:false}); });
    logAct('sentences',1,2.5);
    if(V.sentence===s) render();
  }catch(e){
    s.loading=false; s.error=aiErrorMsg(e);
    if(V.sentence===s) render();
  }
}

function renderProgress(){

  const tot=WORDS.length;
  const vocabPct=Math.round((counts.learning*0.3+counts.known*0.7+counts.mastered)/tot*100);
  const avg=a=>a.length?a.reduce((s,x)=>s+(x.band||0),0)/a.length:null;
  const skills=[
    {k:'Từ vựng',v:vocabPct,label:vocabPct+'%',note:''},
    {k:'Writing',v:null,label:'GĐ2'},{k:'Speaking',v:null,label:'GĐ2'},{k:'Listening',v:null,label:'GĐ3'},{k:'Reading',v:null,label:'GĐ3'}
  ];
  ['writing','speaking','listening','reading'].forEach((s,i)=>{ const b=recentBand(s,5); if(b!=null){ skills[i+1].v=Math.round(b/9*100); skills[i+1].label='Band '+b.toFixed(1);} });

  // activity last 14 days
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*DAY); days.push({k:dkey(d), d, a:act(dkey(d))}); }
  const maxMin=Math.max(CONFIG.dailyMinutes*1.2,...days.map(x=>x.a.min||0));
  const W=640,H=200,pl=30,pb=26,pt=12,bw=(W-pl-10)/14;
  const y=v=>pt+(H-pt-pb)*(1-v/maxMin);
  let bars='';
  days.forEach((x,i)=>{
    const m=x.a.min||0; const bx=pl+i*bw+bw*0.18, wdt=bw*0.64;
    const hgt=Math.max(m>0?3:0,(H-pt-pb)-(y(m)-pt));
    const isToday=i===13;
    bars+=`<rect x="${bx}" y="${H-pb-hgt}" width="${wdt}" height="${hgt}" rx="4" fill="${m>=CONFIG.dailyMinutes?'var(--ok)':'var(--primary)'}" opacity="${isToday?1:.85}"><title>${x.k}: ${m} phút</title></rect>`;
    bars+=`<text x="${bx+wdt/2}" y="${H-8}" text-anchor="middle">${x.d.getDate()}/${x.d.getMonth()+1}</text>`;
  });
  const gy=y(CONFIG.dailyMinutes);
  const actSvg=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Số phút học 14 ngày gần nhất">
    <line x1="${pl}" x2="${W-6}" y1="${H-pb}" y2="${H-pb}" stroke="var(--border)"/>
    <line x1="${pl}" x2="${W-6}" y1="${gy}" y2="${gy}" stroke="var(--warn)" stroke-dasharray="4 4"/>
    <text x="${pl-4}" y="${gy+4}" text-anchor="end">${CONFIG.dailyMinutes}</text><text x="${pl-4}" y="${H-pb+4}" text-anchor="end">0</text>
    ${bars}</svg>`;

  // status stacked bar
  const segs=[['new','Chưa học','var(--gray)'],['learning','Đang học','var(--warn)'],['known','Đã thuộc','var(--primary2)'],['mastered','Thành thạo','var(--ok)']];
  let acc=0; const stack=segs.map(s=>{ const w=counts[s[0]]/tot*100; const r=`<rect x="${acc}%" y="0" width="${w}%" height="22" fill="${s[2]}"><title>${s[1]}: ${counts[s[0]]}</title></rect>`; acc+=w; return r; }).join('');

  // mistakes
  const types={}; S.mistakes.forEach(m=>{ types[m.type]=(types[m.type]||0)+1; });
  const typeArr=Object.entries(types).sort((a,b)=>b[1]-a[1]);
  const maxT=Math.max(1,...typeArr.map(t=>t[1]));
  const filt=P.mfilter;
  const list=S.mistakes.slice().reverse().filter(m=> filt==='all'? !m.mastered : filt==='done'? m.mastered : (m.type===filt && !m.mastered));
  const totals={cards:0,sentences:0,min:0}; Object.values(S.activity).forEach(a=>{totals.cards+=a.cards||0;totals.sentences+=a.sentences||0;totals.min+=a.min||0;});

  return `
  <div class="grid g4">
    <div class="card stat"><b>🔥 ${streak()}</b><span>ngày liên tiếp</span></div>
    <div class="card stat"><b>${Math.round(totals.min)}</b><span>tổng số phút học</span></div>
    <div class="card stat"><b>${totals.cards}</b><span>lượt ôn flashcard</span></div>
    <div class="card stat"><b>${totals.sentences}</b><span>câu đã viết & được sửa</span></div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h2>Mức độ theo kỹ năng</h2>
      ${skills.map(s=>`<div class="skillrow"><b class="small">${s.k}</b><div class="pbar"><i style="width:${s.v||0}%;${s.v==null?'background:var(--gray)':''}"></i></div><span class="small ${s.v==null?'muted':''}" style="text-align:right">${s.label}</span></div>`).join('')}
      <div class="muted tiny" style="margin-top:6px">Trung bình band 5 lần làm bài gần nhất. Listening & Reading quy đổi từ tỷ lệ câu đúng.</div>
    </div>
    <div class="card">
      <h2>Kho từ vựng (${tot} từ)</h2>
      <svg viewBox="0 0 100 22" preserveAspectRatio="none" width="100%" height="22" style="border-radius:8px;overflow:hidden;display:block">${stack}</svg>
      <div class="legend">${segs.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}: <b>${counts[s[0]]}</b></span>`).join('')}</div>
      <div style="margin-top:14px">${VOCAB_TOPICS.map(t=>{const st=topicStats(t);return `<div class="skillrow" style="grid-template-columns:130px 1fr 50px"><span class="small">${t.icon} ${esc(t.name)}</span><div class="pbar"><i style="width:${Math.round(st.learned/st.total*100)}%"></i></div><span class="small muted" style="text-align:right">${st.learned}/${st.total}</span></div>`;}).join('')}</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row"><h2 style="margin:0">Đường tiến bộ band theo kỹ năng</h2><span class="spacer"></span><span class="chip blue">Mục tiêu ${CONFIG.targetBand.toFixed(1)}</span></div>
    ${bandTrend()}
    ${recentGraded()}
  </div>

  <div class="card" style="margin-top:16px">
    <div class="row"><h2 style="margin:0">Thời gian học 14 ngày gần nhất</h2><span class="spacer"></span><span class="legend" style="margin:0"><span><i style="background:var(--primary)"></i>phút học</span><span><i style="background:var(--ok)"></i>đạt mục tiêu</span><span><i style="background:var(--warn)"></i>mục tiêu ${CONFIG.dailyMinutes}′</span></span></div>
    ${actSvg}
  </div>

  <div class="section-title"><h2>📒 Sổ lỗi hay mắc</h2><span class="chip red">${S.mistakes.filter(m=>!m.mastered).length} cần ôn</span><span class="chip green">${S.mistakes.filter(m=>m.mastered).length} đã nắm</span></div>
  ${S.mistakes.length?`
  <div class="grid g2" style="grid-template-columns:1fr 2fr;align-items:start">
    <div class="card">
      <h3>Loại lỗi bạn hay gặp</h3>
      ${typeArr.map(t=>`<div class="skillrow" style="grid-template-columns:110px 1fr 30px"><span class="small">${esc(t[0])}</span><div class="pbar"><i style="width:${t[1]/maxT*100}%;background:var(--bad)"></i></div><span class="small" style="text-align:right">${t[1]}</span></div>`).join('')}
      <button class="btn sm" style="margin-top:12px;width:100%" onclick="startMistakeReview()">🔁 Ôn lại lỗi (dạng thẻ)</button>
    </div>
    <div>
      ${P.reviewIdx!=null?renderMistakeReview():`
      <div class="tabs"><button class="tab ${filt==='all'?'active':''}" onclick="P.mfilter='all';render()">Cần ôn</button>${typeArr.map(t=>`<button class="tab ${filt===t[0]?'active':''}" onclick='P.mfilter=${JSON.stringify(t[0])};render()'>${esc(t[0])}</button>`).join('')}<button class="tab ${filt==='done'?'active':''}" onclick="P.mfilter='done';render()">Đã nắm</button></div>
      ${list.length?list.slice(0,60).map(m=>`
        <div class="mistake">
          <div class="row"><span class="chip">${esc(m.type)}</span>${m.word?`<span class="chip blue">${esc(m.word)}</span>`:''}<span class="muted tiny">${esc(m.src)} · ${esc(m.date)}</span><span class="spacer"></span>
          ${m.mastered?`<button class="btn sm ghost" onclick="setMastered('${m.id}',false)">Ôn lại</button>`:`<button class="btn sm ok" onclick="setMastered('${m.id}',true)">Đã nắm</button>`}
          <button class="btn sm ghost" onclick="delMistake('${m.id}')" aria-label="Xoá">✕</button></div>
          <div style="margin:8px 0 4px"><span class="wrong">${esc(m.wrong)}</span> → <span class="right">${esc(m.fix)}</span></div>
          <div class="small">${esc(m.explain)}</div>
          ${m.sentence?`<div class="muted tiny" style="margin-top:4px">Câu gốc: “${esc(m.sentence)}”</div>`:''}
        </div>`).join(''):'<div class="empty"><div class="big">🎯</div>Không có lỗi nào ở mục này.</div>'}`}
    </div>
  </div>`:`<div class="card empty"><div class="big">📒</div>Sổ lỗi đang trống. Mỗi khi AI sửa câu của bạn, lỗi sẽ tự được ghi vào đây để ôn lại.<div style="margin-top:12px"><button class="btn" onclick="openSentence(null)">${I.pen} Đặt câu đầu tiên</button></div></div>`}
  `;
}
function setMastered(id,v){ const m=S.mistakes.find(x=>x.id===id); if(!m) return; m.mastered=v; if(v) logAct('review',1,0.5); else save(); render(); }
function delMistake(id){ S.mistakes=S.mistakes.filter(x=>x.id!==id); save(); render(); }
let MR=[];
function startMistakeReview(){ MR=S.mistakes.filter(m=>!m.mastered).map(m=>m.id).sort(()=>Math.random()-0.5).slice(0,10); if(!MR.length){ toast('Bạn đã nắm hết các lỗi rồi 👏'); return; } P.reviewIdx=0; P.reveal=false; render(); }
function renderMistakeReview(){
  if(P.reviewIdx>=MR.length){ return `<div class="card empty"><div class="big">✅</div><h2>Xong lượt ôn lỗi!</h2><button class="btn" onclick="P.reviewIdx=null;render()">Về sổ lỗi</button></div>`; }
  const m=S.mistakes.find(x=>x.id===MR[P.reviewIdx]); if(!m){ P.reviewIdx++; return renderMistakeReview(); }
  return `<div class="card">
    <div class="row"><b>Ôn lỗi ${P.reviewIdx+1}/${MR.length}</b><span class="spacer"></span><button class="btn sm ghost" onclick="P.reviewIdx=null;render()">Thoát</button></div>
    <p class="small muted">Cụm dưới đây bị sai. Bạn hãy tự sửa trong đầu (hoặc gõ ra), rồi bấm “Xem đáp án”.</p>
    ${m.sentence?`<div class="ex"><div>${esc(m.sentence)}</div></div>`:''}
    <div style="font-size:1.1rem;margin:8px 0"><span class="wrong" style="text-decoration:none">${esc(m.wrong)}</span> → ?</div>
    <input type="text" id="mrInput" placeholder="Gõ cách sửa của bạn…">
    ${P.reveal?`<div class="notice ok" style="margin-top:12px"><div>Đáp án: <span class="right">${esc(m.fix)}</span></div><div class="small" style="margin-top:6px">${esc(m.explain)}</div></div>
      <div class="row" style="margin-top:12px"><button class="btn warn" onclick="mrNext(false)">Chưa nhớ</button><button class="btn ok" onclick="mrNext(true)">Nhớ rồi</button></div>`
    :`<div style="margin-top:12px"><button class="btn" onclick="P.reveal=true;const v=(document.getElementById('mrInput')||{}).value;render();if(v)document.getElementById('mrInput').value=v">Xem đáp án</button></div>`}
  </div>`;
}
function mrNext(ok){
  const m=S.mistakes.find(x=>x.id===MR[P.reviewIdx]);
  if(m){ m.reviews=(m.reviews||0)+(ok?1:0); if(ok && m.reviews>=2) m.mastered=true; }
  logAct('review',1,0.5);
  P.reviewIdx++; P.reveal=false; render();
}

/* =====================================================================
   GĐ2 · SHARED HELPERS (band, word count, dictation)
   ===================================================================== */
function roundBand(x){ const f=Math.floor(x), d=x-f; return d<0.25?f:d<0.75?f+0.5:f+1; }
function clampBand(b){ b=Number(b); if(!isFinite(b)) return null; return Math.max(0,Math.min(9,Math.round(b*2)/2)); }
function recentBand(skill,n){ const a=(S.scores[skill]||[]).slice(-(n||3)); if(!a.length) return null; return roundBand(a.reduce((s,x)=>s+(x.band||0),0)/a.length); }
function bandColor(b){ return b==null?'var(--gray)':b>=7?'var(--ok)':b>=6?'var(--primary)':b>=5?'var(--warn)':'var(--bad)'; }
function wc(t){ return (String(t||'').match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g)||[]).length; }
let _ss; function saveSoon(){ clearTimeout(_ss); _ss=setTimeout(save,700); }
function addMistakes(errors, src, context, word){
  const today=dkey();
  (errors||[]).slice(0,10).forEach((e,i)=>{
    if(e && e.wrong && e.fix && String(e.wrong).trim()!==String(e.fix).trim())
      S.mistakes.push({id:'m'+Date.now()+'_'+i+Math.random().toString(36).slice(2,5), src, word:word||'', type:e.type||'Khác', wrong:e.wrong, fix:e.fix, explain:e.explain||'', sentence:context||'', corrected:'', date:today, reviews:0, mastered:false});
  });
}
const CRIT_NAMES={TA:'Task Achievement',TR:'Task Response',CC:'Coherence & Cohesion',LR:'Lexical Resource',GRA:'Grammatical Range & Accuracy',FC:'Fluency & Coherence',P:'Pronunciation'};
function critRows(crit, keys){
  return keys.map(k=>{ const c=(crit||{})[k]||{}; const b=clampBand(c.band);
    return `<div class="crit"><div class="row"><b class="small">${k} · ${CRIT_NAMES[k]}</b><span class="spacer"></span><span class="bandpill" style="background:${bandColor(b)}">${b!=null?b.toFixed(1):'—'}</span></div>
      <div class="pbar" style="margin-top:6px"><i style="width:${(b||0)/9*100}%;background:${bandColor(b)}"></i></div>
      ${c.comment_vi?`<div class="small" style="margin-top:6px">${esc(c.comment_vi)}</div>`:''}</div>`; }).join('');
}
function listBlock(title, arr, icon){ if(!arr||!arr.length) return ''; return `<div style="margin-top:14px"><b class="small">${icon||''} ${title}</b><ul class="blist small">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }
function errItem(e){ return `<div class="err"><span class="chip">${esc(e.type||'Lỗi')}</span><div style="margin:6px 0"><span class="wrong">${esc(e.wrong)}</span> → <span class="right">${esc(e.fix)}</span></div><div class="small">${esc(e.explain)}</div></div>`; }
function spk(t){ return `<button class="speak" data-t="${esc(t)}" onclick="event.stopPropagation();speak(this.dataset.t)" aria-label="Nghe">${I.sound}</button>`; }

/* ---------- Dictation (nói thay vì gõ) ---------- */
let DICT=null, dictTarget=null, dictBase='', dictState='idle';
function joinT(a,b){ a=(a||'').replace(/\s+$/,''); b=(b||'').trim(); return a&&b ? a+' '+b : (a||b); }
async function initDictation(){
  if(!(window.claude && typeof window.claude.use==='function')) return;
  try{ DICT=await claude.use('dictation'); }catch(e){ DICT=null; }
  if(DICT){
    try{
      DICT.onPartial(({text})=>{ const el=document.getElementById(dictTarget); if(el){ el.value=joinT(dictBase,text); el.dispatchEvent(new Event('input')); } });
      DICT.onFinal(({text})=>{ dictBase=joinT(dictBase,text); const el=document.getElementById(dictTarget); if(el){ el.value=dictBase; el.dispatchEvent(new Event('input')); } });
      DICT.onState(({state})=>{ dictState=state; updateMicBtn(); });
    }catch(e){ DICT=null; }
  }
  if(route==='speaking') render();
}
function toggleMic(target){
  if(!DICT){ toast('Micro chưa khả dụng ở đây — bạn hãy gõ, hoặc dùng nút micro trên bàn phím điện thoại.'); return; }
  if(dictState==='listening'){ DICT.stop().catch(()=>{}); return; }
  dictTarget=target; const el=document.getElementById(target); dictBase=el?el.value:'';
  DICT.start().catch(e=>{
    dictState='idle'; updateMicBtn();
    if(e && e.code==='not_granted'){ DICT=null; toast('Bạn chưa cho phép dùng micro — vẫn có thể gõ câu trả lời.'); render(); }
    else toast('Chưa bật được micro, bạn thử bấm lại nhé.');
  });
}
function updateMicBtn(){
  const b=document.getElementById('micBtn'); if(!b) return;
  const on=dictState==='listening';
  b.classList.toggle('rec',on); b.classList.toggle('ghost',!on);
  b.innerHTML = on ? '■ Dừng nói' : I.speaking+' Nói';
}

/* ---------- Biểu đồ Task 1 ---------- */
const CH_COLORS=['var(--primary)','#8a9bb0','#e08a1e','#15803d'];
function drawChart(c){
  const W=620,H=300,pl=46,pr=14,pt=16,pb=40, iw=W-pl-pr, ih=H-pt-pb;
  const ymax=c.yMax||Math.max(...c.series.flatMap(s=>s.data))*1.1;
  const y=v=>pt+ih*(1-v/ymax);
  let g='';
  for(let i=0;i<=5;i++){ const v=ymax/5*i; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" ${i?'stroke-dasharray="3 3"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  const n=c.labels.length;
  if(c.type==='line'){
    const x=i=>pl+12+(iw-24)*(i/(n-1));
    c.labels.forEach((l,i)=> g+=`<text x="${x(i)}" y="${H-pb+18}" text-anchor="middle">${esc(l)}</text>`);
    c.series.forEach((s,si)=>{ const col=CH_COLORS[si%4];
      g+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${s.data.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
      s.data.forEach((v,i)=> g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${col}"><title>${esc(s.name)} ${esc(c.labels[i])}: ${v}${c.unit==='%'?'%':' '+esc(c.unit)}</title></circle>`); });
  } else {
    const gw=iw/n, bw=gw*0.72/c.series.length;
    c.labels.forEach((l,i)=>{ const gx=pl+gw*i+gw*0.14;
      c.series.forEach((s,si)=>{ const v=s.data[i]; g+=`<rect x="${gx+si*bw}" y="${y(v)}" width="${bw-2}" height="${pt+ih-y(v)}" rx="3" fill="${CH_COLORS[si%4]}"><title>${esc(s.name)} – ${esc(l)}: ${v} ${esc(c.unit)}</title></rect>`; });
      g+=`<text x="${pl+gw*i+gw/2}" y="${H-pb+18}" text-anchor="middle">${esc(l)}</text>`; });
  }
  g+=`<text x="12" y="${pt+ih/2}" transform="rotate(-90 12 ${pt+ih/2})" text-anchor="middle">${esc(c.unit==='%'?'Percentage (%)':c.unit)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ đề bài">${g}</svg>
    <div class="legend">${c.series.map((s,si)=>`<span><i style="background:${CH_COLORS[si%4]}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
