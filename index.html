      + (others.length?`<div class="small" style="font-weight:700;margin-top:10px">Dùng chung</div><div class="vgrid">${others.map(v=>vchip(v.en,v.vi,v.note_vi)).join('')}</div>`:'')
    : '<div class="notice small">Bấm “AI gợi ý từ vựng” — gia sư sẽ đọc ý tưởng tiếng Việt ở bước 1 và gợi ý cụm từ tiếng Anh (band 6.5–7.5) cho từng phần.</div>'}
  <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="wGo(1)">← Ý tưởng</button><span class="spacer"></span><button class="btn" onclick="wGo(3)">Tiếp: Viết từng câu →</button></div></div>`;
}
function aiVocab(){
  const p=wP(W.pid), d=wD(W.pid), secs=wSecs(p);
  const ideas=secs.map(s=>`[${s.id}] ${s.name}: ${(d.ideas[s.id]||'').trim()||'(chưa có ý)'}`).join('\n');
  const have=d.vocab.map(v=>v.en).concat((p.useful||[]).map(u=>u[0])).join('; ');
  const prompt=`Bạn là giáo viên IELTS người Việt. ${promptCtx(p)}

Ý tưởng tiếng Việt của học viên (mục tiêu band 7.0, vốn từ nâng cao còn ít):
${ideas}

Hãy gợi ý 10–14 từ/cụm từ/collocation tiếng Anh ở mức band 6.5–7.5 giúp học viên diễn đạt CHÍNH những ý trên, phân theo từng phần.
QUY TẮC: Mỗi mục tối đa 6 từ. KHÔNG viết câu hoàn chỉnh, KHÔNG viết đoạn văn. Không lặp lại các cụm đã có: ${have}.
Chỉ trả về DUY NHẤT JSON: {"items":[{"en":"cụm từ","vi":"nghĩa tiếng Việt","note_vi":"cách dùng ngắn gọn (vd: + V-ing, dùng trong văn trang trọng)","section":"mã phần trong ngoặc vuông"}]}`;
  runAI('vocab', prompt, r=>{
    const seen=new Set(d.vocab.map(v=>String(v.en).toLowerCase()));
    (r.items||[]).forEach(v=>{ if(v&&v.en&&!seen.has(String(v.en).toLowerCase())){ seen.add(String(v.en).toLowerCase()); d.vocab.push({en:v.en,vi:v.vi||'',note_vi:v.note_vi||'',section:v.section||''}); } });
    save();
  }, aiVocab);
}

/* ---- Bước 3: Viết từng câu ---- */
function wStep3(p,d){
  const secs=wSecs(p); if(!W.sec||!secs.find(s=>s.id===W.sec)) W.sec=secs[0].id;
  const sec=secs.find(s=>s.id===W.sec); const list=d.sents[sec.id]||[];
  const total=wc(wEssay(p,d));
  const vocab=[...d.vocab.filter(v=>v.section===sec.id), ...(p.useful||[]).map(u=>({en:u[0],vi:u[1]}))];
  return `<div class="card">
  <div class="row"><h2 style="margin:0">Bước 3 · Viết từng câu</h2><span class="spacer"></span><span class="chip ${total>=minWords(p)?'green':'blue'}">${total}/${minWords(p)} từ</span></div>
  <p class="muted small">Viết từng câu một. Gia sư sửa lỗi tối thiểu và giải thích — bạn quyết định dùng câu đã sửa hay giữ câu của mình.</p>
  <div class="tabs">${secs.map(s=>`<button class="tab ${s.id===sec.id?'active':''}" onclick="W.sec='${s.id}';W.pending=null;render()">${esc(s.name)} (${(d.sents[s.id]||[]).length})</button>`).join('')}</div>
  <div class="grid g2" style="grid-template-columns:1fr 1.4fr;align-items:start">
    <div>
      <div class="notice small"><b>Ý của bạn:</b> ${esc(d.ideas[sec.id]||'(chưa ghi ý cho phần này — có thể quay lại bước 1)')}</div>
      <div class="muted small" style="margin:8px 0">${esc(sec.guide)}</div>
      <b class="small">Từ vựng có thể dùng</b>
      <div class="chips" style="margin-top:6px">${vocab.slice(0,16).map(v=>`<span class="chip blue" title="${esc(v.vi)}">${esc(v.en)}</span>`).join('')}</div>
    </div>
    <div>
      ${list.length?list.map((s,i)=>`<div class="sent"><span class="num">${i+1}</span><div style="flex:1">${esc(s.text)}${s.orig&&s.orig!==s.text?`<div class="muted tiny">Câu gốc: ${esc(s.orig)}</div>`:''}</div><button class="iconbtn sm" onclick="wDelSent(${i})" title="Xoá câu" aria-label="Xoá câu">✕</button></div>`).join(''):'<div class="muted small" style="margin-bottom:8px">Chưa có câu nào. Viết câu đầu tiên của phần này bên dưới.</div>'}
      ${W.pending?wPendingBox():`
      <textarea id="wInput" placeholder="Viết câu tiếp theo bằng tiếng Anh…" oninput="W.input=this.value">${esc(W.input)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="wCheckSent()" ${W.loading?'disabled':''}>${btnLbl('sent',I.spark+' AI sửa câu')}</button><button class="btn ghost sm" onclick="wAddRaw()">Thêm, không cần sửa</button></div>`}
    </div>
  </div>
  <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="wGo(2)">← Từ vựng</button><span class="spacer"></span><button class="btn" onclick="wGo(4)">Tiếp: Ghép đoạn →</button></div></div>`;
}
function wPendingBox(){
  const {orig,r}=W.pending;
  return `<div class="pending">
    <div class="small muted">Câu của bạn:</div><div>${esc(orig)}</div>
    ${r.correct?'<div style="margin-top:8px"><span class="chip green">Câu đúng — tốt lắm!</span></div>':`<div class="small muted" style="margin-top:10px">Câu đã sửa (tối thiểu):</div><div><span class="right">${esc(r.corrected)}</span></div>`}
    ${(r.errors||[]).map(errItem).join('')}
    ${r.comment_vi?`<p class="small" style="margin-bottom:0">${esc(r.comment_vi)}</p>`:''}
    ${r.next_vi?`<div class="ai-fb">${I.spark}<div class="small"><b>Gợi ý cho câu tiếp theo:</b> ${esc(r.next_vi)}</div></div>`:''}
    <div class="row" style="margin-top:10px">${r.correct?`<button class="btn ok" onclick="wAccept(false)">Thêm vào đoạn</button>`:`<button class="btn ok" onclick="wAccept(true)">Dùng câu đã sửa</button><button class="btn ghost" onclick="wAccept(false)">Giữ câu của tôi</button>`}<button class="btn ghost" onclick="wRewrite()">Viết lại</button></div>
  </div>`;
}
function wPushSent(text, orig){
  const d=wD(W.pid); const id=W.sec;
  (d.sents[id]=d.sents[id]||[]).push({text, orig});
  if(d.paras[id]!=null) d.paras[id]=joinT(d.paras[id], text);
  d.result=null; save();
}
function wCheckSent(){
  const p=wP(W.pid), d=wD(W.pid); const ta=document.getElementById('wInput');
  const text=(ta?ta.value:W.input||'').trim(); W.input=text;
  if(wc(text)<3){ toast('Bạn viết một câu hoàn chỉnh (ít nhất 3 từ) nhé.'); return; }
  const sec=wSecs(p).find(s=>s.id===W.sec);
  const before=wEssay(p,d);
  const prompt=`Bạn là giáo viên IELTS Writing người Việt, tận tâm và khích lệ. ${promptCtx(p)}

Học viên (mục tiêu band 7.0) đang viết phần "${sec.name}" (${sec.guide}).
Ý tiếng Việt của học viên cho phần này: ${d.ideas[sec.id]||'(không có)'}
Những câu đã viết trước đó: """${before||'(chưa có)'}"""
CÂU MỚI cần sửa: """${text}"""

Nhiệm vụ:
1. Sửa TỐI THIỂU câu mới (ngữ pháp, từ vựng, collocation, chính tả, dấu câu, liên kết với câu trước, độ trang trọng học thuật). Giữ nguyên ý và cấu trúc của học viên, KHÔNG viết thành câu khác.
2. Giải thích từng lỗi bằng tiếng Việt, ngắn gọn, dễ hiểu.
3. Gợi ý cho câu tiếp theo bằng một CÂU HỎI tiếng Việt để học viên tự nghĩ (không viết câu tiếng Anh mẫu).
Chỉ trả về DUY NHẤT JSON: {"correct": true/false, "corrected": "câu đã sửa tối thiểu (giữ nguyên nếu không lỗi)", "errors": [{"type":"Ngữ pháp | Từ vựng | Collocation | Chính tả | Dấu câu | Liên kết | Văn phong","wrong":"đoạn sai","fix":"đoạn đúng","explain":"giải thích tiếng Việt"}], "comment_vi": "1 câu nhận xét khích lệ", "next_vi": "câu hỏi gợi ý ý tiếp theo"}`;
  runAI('sent', prompt, r=>{
    W.pending={orig:text, r};
    addMistakes(r.errors,'Writing',text);
    logAct('wsent',1,2);
  }, wCheckSent);
}
function wAccept(useFixed){ const {orig,r}=W.pending; const text=(useFixed&&r.corrected)?r.corrected:orig; wPushSent(text,orig); W.pending=null; W.input=''; render(); setTimeout(()=>{const t=document.getElementById('wInput'); t&&t.focus();},50); }
function wRewrite(){ W.input=W.pending.orig; W.pending=null; render(); }
function wAddRaw(){ const ta=document.getElementById('wInput'); const text=(ta?ta.value:'').trim(); if(!text) return; wPushSent(text,text); logAct('wsent',1,1); W.input=''; render(); }
function wDelSent(i){ const d=wD(W.pid); const arr=d.sents[W.sec]||[]; const s=arr.splice(i,1)[0]; if(s&&d.paras[W.sec]!=null) d.paras[W.sec]=d.paras[W.sec].replace(s.text,'').replace(/\s{2,}/g,' ').trim(); d.result=null; save(); render(); }

/* ---- Bước 4: Ghép đoạn ---- */
function wStep4(p,d){
  const secs=wSecs(p); const total=wc(wEssay(p,d)); const c=d.cohesion;
  return `<div class="card"><h2>Bước 4 · Ghép đoạn</h2>
  <p class="muted small">Các câu đã được ghép thành đoạn. Đọc lại, thêm từ nối (However, Moreover, As a result, In contrast…) và chỉnh cho mạch lạc. Bạn có thể sửa trực tiếp trong ô.</p>
  ${secs.map(s=>`<div class="sec-block"><div class="row"><b>${esc(s.name)}</b><span class="spacer"></span><span class="muted tiny" id="pwc-${s.id}">${wc(wParaText(d,s.id))} từ</span></div>
    <textarea class="para" oninput="wEditPara('${s.id}',this.value)">${esc(wParaText(d,s.id))}</textarea></div>`).join('')}
  <div class="row"><span class="chip ${total>=minWords(p)?'green':'amber'}" id="wTotal">${total} từ</span><span class="muted small">Tối thiểu ${minWords(p)} từ</span><span class="spacer"></span>
    <button class="btn ghost" onclick="aiCohesion()" ${W.loading?'disabled':''}>${btnLbl('coh',I.spark+' AI nhận xét mạch lạc')}</button></div>
  ${c?`<div class="ai-fb" style="margin-top:12px">${I.spark}<div class="small"><div>${esc(c.comment_vi||'')}</div>${(c.issues||[]).map(x=>`<div style="margin-top:8px"><b>${esc(x.para||'')}</b>: ${esc(x.issue_vi||'')}<br><span class="muted">→ ${esc(x.suggestion_vi||'')}</span></div>`).join('')}</div></div>`:''}
  <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="wGo(3)">← Viết từng câu</button><span class="spacer"></span><button class="btn" onclick="wGo(5)">Tiếp: Hoàn thành & chấm →</button></div></div>`;
}
function wEditPara(id,v){
  const p=wP(W.pid), d=wD(W.pid); d.paras[id]=v; d.result=null;
  const e=document.getElementById('pwc-'+id); if(e) e.textContent=wc(v)+' từ';
  const t=document.getElementById('wTotal'); if(t) t.textContent=wc(wEssay(p,d))+' từ';
  saveSoon();
}
function aiCohesion(){
  const p=wP(W.pid), d=wD(W.pid); const essay=wEssay(p,d);
  if(wc(essay)<30){ toast('Bài còn ngắn quá — viết thêm vài câu rồi nhờ AI nhận xét nhé.'); return; }
  const named=wSecs(p).map(s=>`[${s.name}]\n${wParaText(d,s.id)}`).join('\n\n');
  const prompt=`Bạn là giáo viên IELTS Writing người Việt. ${promptCtx(p)}

Bài viết của học viên (theo từng đoạn):
${named}

Nhận xét về TÍNH MẠCH LẠC & LIÊN KẾT (Coherence & Cohesion) bằng tiếng Việt: thứ tự ý, câu chủ đề, từ nối (thiếu/lạm dụng/sai), đại từ thay thế, sự lặp từ, phân đoạn.
QUY TẮC: KHÔNG viết lại câu hay đoạn cho học viên. Chỉ chỉ ra vấn đề và gợi ý hướng sửa (có thể nêu tên từ nối nên cân nhắc).
Chỉ trả về DUY NHẤT JSON: {"comment_vi":"nhận xét chung 2-3 câu","issues":[{"para":"tên đoạn","issue_vi":"vấn đề","suggestion_vi":"hướng sửa"}]}`;
  runAI('coh', prompt, r=>{ d.cohesion=r; save(); }, aiCohesion);
}

/* ---- Bước 5: Hoàn thành & chấm ---- */
function wStep5(p,d){
  const essay=wEssay(p,d), n=wc(essay), r=d.result, min=minWords(p);
  return `<div class="card"><h2>Bước 5 · Hoàn thành & chấm bài</h2>
  <div class="essay">${essay?essay.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join(''):'<p class="muted">Bài viết đang trống — hãy quay lại bước 3.</p>'}</div>
  <div class="row"><span class="chip ${n>=min?'green':'amber'}">${n} từ</span>${n<min?`<span class="muted small">Thiếu ${min-n} từ — bài dưới ${min} từ sẽ bị trừ điểm ${p.task===1?'TA':'TR'}.</span>`:''}<span class="spacer"></span>
  ${!r?`<button class="btn" onclick="aiGrade()" ${W.loading||!essay?'disabled':''}>${btnLbl('grade',I.spark+' Nộp bài & chấm')}</button>`:''}</div>
  ${r?renderWResult(r,p):''}
  <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="wGo(4)">← Ghép đoạn</button><span class="spacer"></span>
  ${r?`<button class="btn ghost" onclick="wRegrade()">Sửa bài & chấm lại</button><button class="btn" onclick="wReset('${p.id}')">Viết lại từ đầu</button>`:''}</div></div>`;
}
function renderWResult(r,p){
  const keys=[p.task===1?'TA':'TR','CC','LR','GRA'];
  return `<div class="result">
    <div class="row"><div class="bigband" style="color:${bandColor(r.overall)}">${r.overall.toFixed(1)}</div>
      <div style="flex:1;min-width:200px"><b>Band ước lượng</b><div class="muted small">Trung bình 4 tiêu chí, làm tròn theo quy tắc IELTS. Mục tiêu của bạn: ${CONFIG.targetBand.toFixed(1)}${r.overall>=CONFIG.targetBand?' — đã đạt! 🎉':` — còn ${(CONFIG.targetBand-r.overall).toFixed(1)} band.`}</div></div></div>
    ${critRows(r.criteria,keys)}
    ${listBlock('Điểm mạnh',r.strengths_vi,'✅')}
    ${listBlock('Cần cải thiện để lên band',r.improvements_vi,'🎯')}
    ${(r.errors||[]).length?`<div style="margin-top:14px"><b class="small">🛠️ Lỗi quan trọng (đã lưu vào Sổ lỗi)</b>${r.errors.map(errItem).join('')}</div>`:''}
    ${r.next_steps_vi?`<div class="notice info small" style="margin-top:14px"><b>Bài tiếp theo hãy tập trung:</b> ${esc(r.next_steps_vi)}</div>`:''}
  </div>`;
}
function aiGrade(){
  const p=wP(W.pid), d=wD(W.pid); const essay=wEssay(p,d); const n=wc(essay);
  if(n<40){ toast('Bài còn quá ngắn để chấm — bạn viết thêm nhé.'); return; }
  const k1=p.task===1?'TA':'TR';
  const prompt=`Bạn là giám khảo IELTS Writing giàu kinh nghiệm, chấm khách quan, KHÔNG nương tay, đúng band descriptors chính thức. ${promptCtx(p)}

Bài làm của thí sinh (${n} từ, yêu cầu tối thiểu ${minWords(p)} từ):
"""${essay}"""

Chấm theo 4 tiêu chí: ${k1} (${CRIT_NAMES[k1]}), CC, LR, GRA — mỗi tiêu chí band 0–9, bước 0.5. ${p.task===1?'Lưu ý TA: cần overview rõ ràng, chọn đặc điểm chính, số liệu chính xác, có so sánh.':'Lưu ý TR: trả lời đủ mọi phần của đề, quan điểm rõ xuyên suốt, ý được phát triển và có ví dụ.'} Trừ điểm nếu thiếu số từ.
Nhận xét bằng TIẾNG VIỆT, cụ thể, dẫn chứng từ bài. KHÔNG viết lại bài, KHÔNG viết bài mẫu.
Chỉ trả về DUY NHẤT JSON:
{"criteria":{"${k1}":{"band":6.0,"comment_vi":"..."},"CC":{"band":6.0,"comment_vi":"..."},"LR":{"band":6.0,"comment_vi":"..."},"GRA":{"band":6.0,"comment_vi":"..."}},
"strengths_vi":["..."],"improvements_vi":["việc cụ thể cần làm để lên band"],
"errors":[{"type":"Ngữ pháp | Từ vựng | Collocation | Chính tả | Dấu câu | Liên kết","wrong":"đoạn sai nguyên văn","fix":"đoạn đúng","explain":"giải thích tiếng Việt"}],
"next_steps_vi":"1-2 câu: bài sau nên tập trung vào điều gì"}
Liệt kê tối đa 8 lỗi quan trọng nhất.`;
  runAI('grade', prompt, r=>{
    r.criteria=r.criteria||{};
    if(!r.criteria[k1]) r.criteria[k1]=r.criteria.TR||r.criteria.TA||{};
    const bands=[k1,'CC','LR','GRA'].map(k=>clampBand((r.criteria[k]||{}).band)).filter(b=>b!=null);
    if(!bands.length) throw new Error('nobands');
    r.overall=roundBand(bands.reduce((a,b)=>a+b,0)/bands.length);
    d.result=r;
    const today=dkey();
    S.writing.history.push({id:'w'+Date.now(), pid:p.id, task:p.task, title:p.title, date:today, words:n, overall:r.overall, text:essay, result:r});
    S.scores.writing.push({band:r.overall, date:today, task:p.task});
    addMistakes(r.errors,'Writing','');
    logAct('essays',1,5);
    toast(`Đã chấm xong: band ${r.overall.toFixed(1)}`);
  }, aiGrade);
}
function wRegrade(){ const d=wD(W.pid); d.result=null; wGo(4); }
function wReset(pid){ delete S.writing.drafts[pid]; save(); openW(pid); }
function renderWHist(){
  const h=S.writing.history.find(x=>x.id===W.hid); if(!h){ W.view='list'; return renderWriting(); }
  const p=wP(h.pid)||{task:h.task,title:h.title,kind:'',prompt:''};
  return `<button class="back" onclick="W.view='list';render()">${I.back} Danh sách đề</button>
  ${p.prompt?promptBox(p,true):''}
  <div class="card"><div class="row"><h2 style="margin:0">Task ${h.task} · ${esc(h.title)}</h2><span class="spacer"></span><span class="muted small">${esc(h.date)} · ${h.words} từ</span></div>
  <div class="essay">${esc(h.text).split('\n\n').map(x=>`<p>${x}</p>`).join('')}</div>
  ${renderWResult(h.result,p)}</div>`;
}

/* =====================================================================
   SPEAKING — Part 1/2/3, đồng hồ, gõ hoặc nói, AI nhận xét + câu mẫu
   ===================================================================== */
const PART_INFO={
  1:{vi:'Câu hỏi ngắn về bản thân',target:[15,35],tip:'Trả lời 2–4 câu: trả lời thẳng → lý do → ví dụ ngắn. Tránh chỉ nói Yes/No.'},
  2:{vi:'Nói 1–2 phút theo cue card',prep:60,speak:120,tip:'1 phút chuẩn bị: ghi từ khoá cho từng gạch đầu dòng. Nói đủ các ý và cố gắng nói gần 2 phút.'},
  3:{vi:'Thảo luận sâu',target:[30,60],tip:'Trả lời 4–6 câu: quan điểm → giải thích → ví dụ / so sánh → (nhượng bộ) → kết luận ngắn.'}
};
let SP={view:'list', part:0, qid:null, answer:'', notes:'', phase:'idle', t:0, spoke:0, timer:null, loading:false, error:null, result:null};
function spQ(id){ return SPEAKING_QUESTIONS.find(q=>q.id===id); }
function stopTimer(){ if(SP.timer){ clearInterval(SP.timer); SP.timer=null; } }
function spRandom(){
  const done=new Set(S.speaking.history.filter(h=>h.date===dkey()).map(h=>h.qid));
  const pool=SPEAKING_QUESTIONS.filter(q=>!done.has(q.id)&&(!SP.part||q.part===SP.part));
  const arr=pool.length?pool:SPEAKING_QUESTIONS;
  openQ(arr[Math.floor(Math.random()*arr.length)].id);
}
function openQ(id){
  stopTimer();
  Object.assign(SP,{view:'practice', qid:id, answer:'', notes:'', phase:'idle', t:0, spoke:0, loading:false, error:null, result:null});
  if(route!=='speaking') go('speaking'); else render();
  window.scrollTo(0,0);
}
function renderSpeaking(){
  if(SP.view==='practice' && spQ(SP.qid)) return renderSPractice();
  SP.view='list';
  const list=SPEAKING_QUESTIONS.filter(q=>!SP.part||q.part===SP.part);
  return `<div class="card" style="margin-bottom:16px"><div class="row">
    <div style="flex:1;min-width:220px"><h2 style="margin:0 0 4px">Luyện Speaking với gia sư AI</h2>
    <div class="muted small">Chọn câu hỏi → bấm giờ → trả lời bằng cách <b>gõ</b> hoặc <b>nói</b> → AI nhận xét theo tiêu chí IELTS và đưa câu trả lời mẫu band 7–7.5.</div></div>
    <button class="btn" onclick="spRandom()">🎲 Câu hỏi ngẫu nhiên</button></div></div>
  <div class="tabs">${[[0,'Tất cả'],[1,'Part 1'],[2,'Part 2'],[3,'Part 3']].map(([v,n])=>`<button class="tab ${SP.part===v?'active':''}" onclick="SP.part=${v};render()">${n}</button>`).join('')}</div>
  <div class="grid g2">${list.map(q=>{ const last=S.speaking.history.filter(h=>h.qid===q.id).slice(-1)[0];
    return `<div class="card topic" onclick="openQ('${q.id}')">
      <div class="row"><span class="chip blue">Part ${q.part}</span><span class="chip">${esc(q.topic)}</span><span class="spacer"></span>${last?`<span class="bandpill" style="background:${bandColor(last.overall)}">${last.overall.toFixed(1)}</span>`:''}</div>
      <div style="font-weight:700;margin-top:10px">${esc(q.q)}</div>
      <div class="muted tiny" style="margin-top:4px">${PART_INFO[q.part].vi}</div></div>`;}).join('')}</div>`;
}

    ? (SP.phase==='idle'?`<button class="btn" onclick="spStart()">▶ Bắt đầu (1′ chuẩn bị + 2′ nói)</button>`
      : SP.phase==='prep'?`<button class="btn" onclick="spSkipPrep()">Nói ngay</button>`
      : SP.phase==='speak'?`<button class="btn bad" onclick="spStopTalk()">■ Dừng</button>`
      : `<button class="btn ghost" onclick="spStart()">↺ Bấm giờ lại</button>`)
    : (SP.phase==='idle'?`<button class="btn" onclick="spStart()">▶ Bắt đầu trả lời</button>`
      : SP.phase==='speak'?`<button class="btn bad" onclick="spStopTalk()">■ Dừng</button>`
      : `<button class="btn ghost" onclick="spStart()">↺ Bấm giờ lại</button>`);
  return `<button class="back" onclick="stopTimer();SP.view='list';render()">${I.back} Danh sách câu hỏi</button>
  <div class="card">

    ${q.cue?`<div class="cue"><b class="small">You should say:</b><ul>${q.cue.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`:''}

    <div class="field" style="margin-top:14px"><div class="row"><label style="margin:0">Câu trả lời của bạn</label><span class="spacer"></span><span class="muted tiny" id="spWc">${n} từ</span></div>
      <textarea id="spAns" style="min-height:150px;margin-top:6px" placeholder="Gõ câu trả lời, hoặc bấm “Nói” để đọc — chữ sẽ hiện ra ở đây…" oninput="SP.answer=this.value;const e=document.getElementById('spWc');if(e)e.textContent=wc(this.value)+' từ'">${esc(SP.answer)}</textarea>

        <span class="spacer"></span>
        <button class="btn" onclick="spSubmit()" ${SP.loading?'disabled':''}>${SP.loading?'<span class="spinner"></span> Gia sư đang nghe…':I.spark+' AI nhận xét'}</button>
      </div>
    </div>
    ${SP.error?`<div class="notice warn small">${esc(SP.error)} <div style="margin-top:8px"><button class="btn sm" onclick="spSubmit()">Thử lại</button></div></div>`:''}

function fmtT(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateTimerUI(){
  const el=document.getElementById('timerBox'); if(!el) return;
  const q=spQ(SP.qid); if(!q) return; const info=PART_INFO[q.part];
  let cls='', label='', big='', hint='';
  if(q.part===2){
    if(SP.phase==='idle'){ big='1:00'; label='Chưa bắt đầu'; hint='Bạn có 1 phút chuẩn bị và 2 phút nói.'; }
    else if(SP.phase==='prep'){ cls='prep'; big=fmtT(SP.t); label='⏳ Thời gian chuẩn bị'; hint='Ghi từ khoá vào ô ghi chú bên dưới.'; }
    else if(SP.phase==='speak'){ cls='speak'+(SP.spoke>=60?' ok':''); big=fmtT(SP.t); label='🎤 Đang nói — còn lại'; hint=SP.spoke<60?'Cố gắng nói ít nhất 1 phút.':'Tốt! Tiếp tục đến khi hết giờ.'; }
    else { big=fmtT(SP.spoke); label='Bạn đã nói'; hint=SP.spoke>=90?'Độ dài tốt cho Part 2.':'Part 2 nên nói 1:30–2:00.'; cls=SP.spoke>=90?'ok':''; }
  } else {
    const [a,b]=info.target;
    if(SP.phase==='idle'){ big='0:00'; label='Chưa bắt đầu'; hint=`Độ dài gợi ý: ${a}–${b} giây.`; }
    else { big=fmtT(SP.t); label=SP.phase==='speak'?'🎤 Đang trả lời':'Bạn đã trả lời'; cls=(SP.phase==='speak'?'speak ':'')+(SP.t>b+15?'over':SP.t>=a?'ok':''); hint= SP.t<a?`Gợi ý: nói ít nhất ${a} giây.`: SP.t<=b?'Độ dài vừa đẹp.':'Hơi dài — Part '+q.part+' nên gọn hơn.'; }
  }
  el.className='timer '+cls;
  el.innerHTML=`<div class="tnum">${big}</div><div><b class="small">${label}</b><div class="muted small">${hint}</div></div>`;
}
function spStart(){
  const q=spQ(SP.qid); stopTimer();
  if(q.part===2){ SP.phase='prep'; SP.t=60; } else { SP.phase='speak'; SP.t=0; }
  SP.spoke=0;
  SP.timer=setInterval(spTick,1000);
  render();
}
function spTick(){
  const q=spQ(SP.qid); if(!q){ stopTimer(); return; }
  if(q.part===2){
    SP.t--; if(SP.phase==='speak') SP.spoke++;
    if(SP.t<=0){
      if(SP.phase==='prep'){ SP.phase='speak'; SP.t=120; toast('Hết giờ chuẩn bị — bắt đầu nói!'); render(); return; }
      stopTimer(); SP.phase='done'; toast('Hết 2 phút!'); render(); return;
    }
  } else { SP.t++; SP.spoke=SP.t; }
  updateTimerUI();
}
function spSkipPrep(){ SP.phase='speak'; SP.t=120; render(); }
function spStopTalk(){ stopTimer(); SP.phase='done'; render(); }
async function spSubmit(){
  const q=spQ(SP.qid); const ta=document.getElementById('spAns'); const ans=(ta?ta.value:SP.answer||'').trim(); SP.answer=ans;
  if(wc(ans)<5){ toast('Bạn trả lời dài hơn một chút (ít nhất 5 từ) nhé.'); return; }
  if(SP.timer){ stopTimer(); SP.phase='done'; }
  if(DICT && dictState==='listening'){ try{ await DICT.stop(); }catch(e){} }
  const lenGuide={1:'Part 1: 2–4 câu (khoảng 30–60 từ).',2:'Part 2: nói 1:30–2:00 (khoảng 200–280 từ), bao quát đủ các gạch đầu dòng.',3:'Part 3: 4–6 câu (khoảng 70–120 từ), có lập luận và ví dụ.'}[q.part];
  SP.loading=true; SP.error=null; SP.result=null; render();
  const prompt=`Bạn là giám khảo IELTS Speaking giàu kinh nghiệm và là gia sư người Việt tận tâm.
Part ${q.part}. Câu hỏi: "${q.q}"${q.cue?`\nCue card – You should say: ${q.cue.join('; ')}`:''}
Câu trả lời của thí sinh (mục tiêu band 7.0). Có thể được nhập bằng nhận dạng giọng nói nên thiếu dấu câu/viết hoa — KHÔNG trừ điểm vì điều đó:
"""${ans}"""
Thời gian nói đo được: ${SP.spoke?SP.spoke+' giây':'không đo'}. Độ dài phù hợp: ${lenGuide}

Nhiệm vụ:
1. Ước lượng band 0–9 (bước 0.5) cho FC (Fluency & Coherence), LR (Lexical Resource), GRA (Grammatical Range & Accuracy) dựa trên nội dung. KHÔNG chấm Pronunciation (chỉ có văn bản). Chấm khách quan, không nương tay.
2. Nhận xét bằng TIẾNG VIỆT, cụ thể, dẫn chứng từ câu trả lời.
3. Liệt kê lỗi (tối đa 6) và các cách diễn đạt nên nâng cấp (tối đa 5).
4. Viết MỘT câu trả lời mẫu band 7–7.5 cho câu hỏi này: tự nhiên, kiểu văn nói, độ dài đúng Part ${q.part}, nên dựa trên ý của thí sinh nếu hợp lý; kèm bản dịch tiếng Việt.
Chỉ trả về DUY NHẤT JSON:
{"criteria":{"FC":{"band":6.0,"comment_vi":"..."},"LR":{"band":6.0,"comment_vi":"..."},"GRA":{"band":6.0,"comment_vi":"..."}},
"strengths_vi":["..."],"improvements_vi":["..."],
"errors":[{"type":"Ngữ pháp | Từ vựng | Collocation | Diễn đạt","wrong":"...","fix":"...","explain":"giải thích tiếng Việt"}],
"better":[{"yours":"cụm thí sinh dùng","better":"cách nói tự nhiên hơn band 7+","vi":"nghĩa"}],
"model":"câu trả lời mẫu band 7-7.5","model_vi":"bản dịch tiếng Việt","tips_vi":"1-2 lời khuyên ngắn cho lần sau"}`;
  try{
    const r=await askAI(prompt);
    r.criteria=r.criteria||{};
    const bands=['FC','LR','GRA'].map(k=>clampBand((r.criteria[k]||{}).band)).filter(b=>b!=null);
    if(!bands.length) throw new Error('nobands');
    r.overall=roundBand(bands.reduce((a,b)=>a+b,0)/bands.length);
    SP.result=r; SP.loading=false;
    const today=dkey();
    S.speaking.history.push({id:'s'+Date.now(), qid:q.id, part:q.part, date:today, answer:ans.slice(0,1500), seconds:SP.spoke, overall:r.overall});
    S.scores.speaking.push({band:r.overall, date:today, part:q.part});
    addMistakes(r.errors,'Speaking',ans.length>200?'':ans);
    logAct('spk',1,Math.max(2,Math.round((SP.spoke/60+2)*10)/10));
  }catch(e){ SP.loading=false; SP.error=aiErrorMsg(e); }
  if(route==='speaking' && SP.qid===q.id) render();
}

/* ---------- Tiến độ: đường band & lịch sử chấm ---------- */
function bandTrend(){
  const SER=[['writing','var(--primary)','Writing'],['speaking','#e08a1e','Speaking'],['listening','#15803d','Listening'],['reading','#8b5cf6','Reading']].map(([k,c,nm])=>[(S.scores[k]||[]).slice(-10),c,nm]);
  if(!SER.some(x=>x[0].length)) return '<div class="notice small" style="margin-top:10px">Chưa có bài nào được chấm. Hãy làm một bài ở bất kỳ kỹ năng nào để thấy đường tiến bộ.</div>';
  const Wd=640,H=210,pl=30,pr=14,pt=14,pb=26, n=Math.max(2,...SER.map(x=>x[0].length));
  const x=i=>pl+(Wd-pl-pr)*(i/(n-1)); const y=b=>pt+(H-pt-pb)*(1-(Math.max(3,Math.min(9,b))-3)/6);
  let g='';
  [3,4,5,6,7,8,9].forEach(b=>{ g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(b)}" y2="${y(b)}" stroke="${b===CONFIG.targetBand?'var(--warn)':'var(--border)'}" ${b===CONFIG.targetBand?'stroke-width="1.5"':''} stroke-dasharray="${b===CONFIG.targetBand?'5 4':'2 4'}"/><text x="${pl-6}" y="${y(b)+4}" text-anchor="end">${b}</text>`; });
  for(let i=0;i<n;i++) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
  SER.forEach(([arr,col,name])=>{
    if(!arr.length) return;
    if(arr.length>1) g+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${arr.map((p,i)=>x(i)+','+y(p.band)).join(' ')}"/>`;
    arr.forEach((p,i)=> g+=`<circle cx="${x(i)}" cy="${y(p.band)}" r="4.5" fill="${col}"><title>${name} lần ${i+1} (${p.date}): band ${p.band}</title></circle>`);
  });
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Đường band theo kỹ năng" style="margin-top:8px">${g}</svg>
  <div class="legend">${SER.map(x=>`<span><i style="background:${x[1]}"></i>${x[2]}</span>`).join('')}<span><i style="background:var(--warn)"></i>Mục tiêu ${CONFIG.targetBand.toFixed(1)}</span><span>Trục ngang: số lần chấm gần nhất</span></div>`;
}
function recentGraded(){
  const items=[...S.writing.history.map(h=>({k:'w',date:h.date,band:h.overall,label:`Writing Task ${h.task} · ${h.title}`,id:h.id,ts:+h.id.slice(1)})),
               ...S.speaking.history.map(h=>{const q=spQ(h.qid);return {k:'s',date:h.date,band:h.overall,label:`Speaking Part ${h.part} · ${q?q.q:''}`,qid:h.qid,ts:+h.id.slice(1)};}),
               ...S.listening.history.map(h=>{const t=LISTENING_TESTS.find(x=>x.id===h.tid);return {k:'l',date:h.date,band:h.band,label:`Listening · ${t?t.title:''} (${h.correct}/${h.total})`,tid:h.tid,ts:+h.id.slice(1)};}),
               ...S.reading.history.map(h=>{const t=READING_TESTS.find(x=>x.id===h.tid);return {k:'r',date:h.date,band:h.band,label:`Reading · ${t?t.title:''} (${h.correct}/${h.total})`,tid:h.tid,ts:+h.id.slice(1)};})]

    <span class="bandpill" style="background:${bandColor(it.band)}">${it.band.toFixed(1)}</span><span class="small" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.label)}</span><span class="muted tiny">${esc(it.date)}</span></div>`).join('')}</div>`;

/* =====================================================================
   GĐ3 · SHARED — chấm đáp án, quy đổi band, hiển thị câu hỏi
   ===================================================================== */
function normAns(s){
  return String(s==null?'':s).toLowerCase().replace(/[’`]/g,"'").replace(/\b(p\.?m\.?|a\.?m\.?)(?=\s|$)/g,'')
    .replace(/[^a-z0-9.:' -]/g,' ').replace(/\s+/g,' ').trim().replace(/[.]$/,'').replace(/^(the|a|an) /,'');
}
function firstA(a){ return Array.isArray(a)?a[0]:a; }
function isRight(it,v){ if(v==null||String(v).trim()==='') return false; const acc=Array.isArray(it.a)?it.a:[it.a]; return acc.some(a=>normAns(a)===normAns(v)); }
function allItems(groups){ return groups.flatMap(g=>g.items.map(it=>({g,it}))); }
function rawToBand(correct,total,kind){
  const r=Math.round(correct/total*40);
  const T= kind==='L' ? [[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[6,3.5],[4,3],[0,2.5]]
                      : [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[0,2.5]];
  for(const [m,b] of T) if(r>=m) return {band:b,raw:r};
  return {band:2.5,raw:r};
}
function ansText(g,it,v){
  if(v==null||String(v).trim()==='') return '(bỏ trống)';
  if(g.type==='mcq'){ const o=it.opts.find(o=>o[0]===v); return o?`${v}. ${o[1]}`:v; }
  if(g.type==='headings'){ const h=g.list.find(h=>h[0]===v); return h?`${v}. ${h[1]}`:v; }
  if(g.type==='summary'){ const b=g.box.find(b=>b[0]===v); return b?`${v}. ${b[1]}`:v; }
  return v;
}
function setAns(ctx,n,v){ (ctx==='L'?L:R).ans[n]=v; }
const TFNG_SHORT={'TRUE':'TRUE','FALSE':'FALSE','NOT GIVEN':'NOT GIVEN'};
function renderGroups(ctx,groups,ans,sub){
  return groups.map(g=>`<div class="qgroup">
    ${g.title?`<h3>${esc(g.title)}</h3>`:''}<div class="qinstr">${esc(g.instr)}</div>
    ${g.type==='headings'?`<div class="hbox"><b class="small">List of Headings</b>${g.list.map(h=>`<div class="small"><b style="display:inline-block;min-width:34px">${h[0]}</b>${esc(h[1])}</div>`).join('')}</div>`:''}
    ${g.type==='summary'?renderSummary(ctx,g,ans,sub):''}
    ${g.items.map(it=>renderQItem(ctx,g,it,ans,sub)).join('')}
  </div>`).join('');
}
function renderSummary(ctx,g,ans,sub){
  const html=esc(g.text).replace(/\[(\d+)\]/g,(m,n)=>{ n=+n; const it=g.items.find(i=>i.n===n); const v=ans[n];
    if(sub){ const ok=isRight(it,v); return `<b class="${ok?'right':'wrong'}" style="text-decoration:none">(${n}) ${esc(v?ansText(g,it,v):'—')}</b>`; }
    return `<select class="gapin" style="width:auto" aria-label="Câu ${n}" onchange="setAns('${ctx}',${n},this.value)"><option value="">(${n})</option>${g.box.map(b=>`<option value="${b[0]}" ${v===b[0]?'selected':''}>${b[0]}</option>`).join('')}</select>`; });
  return `<div class="hbox"><div class="chips">${g.box.map(b=>`<span class="chip"><b>${b[0]}</b>&nbsp;${esc(b[1])}</span>`).join('')}</div></div><div class="summary-text">${html}</div>`;
}
function renderQItem(ctx,g,it,ans,sub){

      : `<input class="gapin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu ${it.n}" value="${esc(v||'')}" oninput="setAns('${ctx}',${it.n},this.value)">`;

    body=`<span>${esc(it.q)}</span><div class="opts">${it.opts.map(o=>`<label class="opt ${sub&&o[0]===A?'correct':''} ${sub&&v===o[0]&&!ok?'chosen-wrong':''}"><input type="radio" name="${ctx}${it.n}" value="${o[0]}" ${v===o[0]?'checked':''} ${sub?'disabled':''} onchange="setAns('${ctx}',${it.n},this.value)"><span><b>${o[0]}</b>&nbsp; ${esc(o[1])}</span></label>`).join('')}</div>`;
  } else if(g.type==='tfng'){
    body=`<span>${esc(it.q)}</span><div class="tfng">${['TRUE','FALSE','NOT GIVEN'].map(c=>`<label class="${sub&&c===A?'correct':''} ${sub&&v===c&&!ok?'chosen-wrong':''}"><input type="radio" name="${ctx}${it.n}" value="${c}" ${v===c?'checked':''} ${sub?'disabled':''} onchange="setAns('${ctx}',${it.n},this.value)">${c}</label>`).join('')}</div>`;
  } else if(g.type==='headings'){
    body=`<span>Paragraph <b>${it.para}</b></span> <select class="gapin" style="width:auto" aria-label="Câu ${it.n}" ${sub?'disabled':''} onchange="setAns('${ctx}',${it.n},this.value)"><option value="">— chọn —</option>${g.list.map(h=>`<option value="${h[0]}" ${v===h[0]?'selected':''}>${h[0]}</option>`).join('')}</select>`;
  } else if(g.type==='summary'){
    if(!sub) return '';

  }
  return `<div class="qitem ${sub?(ok?'right':'wrongq'):''}" id="${ctx}q${it.n}"><span class="qnum">${it.n}</span>${body}${sub?explainBlock(ctx,g,it,v,ok):''}</div>`;
}
function explainBlock(ctx,g,it,v,ok){

    <div style="margin-top:6px">💡 ${esc(it.ex)}</div>
    ${ctx==='L'?lEvidence(it):rEvidence(it)}

}

let L={view:'list', id:null, ans:{}, sub:false, mode:'practice', started:false, plays:0, showVi:false, result:null, confirm:false};
let LP={idx:0, playing:false, token:0};
const FEMALE_RX=/female|woman|libby|sonia|hazel|susan|serena|kate|martha|maisie|amy|emma|fiona|karen|moira|tessa|samantha|victoria|zira|aria|jenny|ava|allison|natasha|clara|olivia|bella|nova/i;
const MALE_RX=/\bmale\b|ryan|george|daniel|arthur|thomas|oliver|alfie|elliot|harry|brian|guy|david|mark|fred|alex|james|rishi|william|noah|puck|aaron/i;
function voiceFor(g){
  loadVoices();
  const gb=VOICES.filter(v=>/en[-_]GB/i.test(v.lang));
  for(const pool of [gb,VOICES]){
    const m=pool.filter(v=> g==='m' ? (MALE_RX.test(v.name)&&!/female/i.test(v.name)) : FEMALE_RX.test(v.name));
    if(m.length) return m[0];
  }
  return pickVoice();
}
function speakerVoice(t,s){
  const keys=Object.keys(t.speakers);
  if(keys.length===1) return {voice:pickVoice(), pitch:1};
  const vs={}; keys.forEach(k=>vs[k]=voiceFor(t.speakers[k].gender));
  const same=keys.every(k=>vs[k]===vs[keys[0]]);
  return {voice:vs[s], pitch: same ? (t.speakers[s].gender==='m'?0.8:1.2) : 1};
}
function lTest(){ return LISTENING_TESTS.find(t=>t.id===L.id); }
function lUtter(t,ln){
  const u=new SpeechSynthesisUtterance(ln.t); const sv=speakerVoice(t,ln.s);
  if(sv.voice){ u.voice=sv.voice; u.lang=sv.voice.lang; } else u.lang='en-GB';
  u.pitch=sv.pitch; u.rate=S.settings.rate||0.9; return u;
}
function lPlay(){
  if(!('speechSynthesis' in window)){ toast('Trình duyệt này chưa hỗ trợ giọng đọc — hãy thử Chrome hoặc Edge trên laptop.'); return; }
  const t=lTest(); if(!t) return;
  if(L.mode==='exam' && L.started && !L.sub) return;
  L.started=true; LP.playing=true; const tok=++LP.token;
  try{ speechSynthesis.cancel(); }catch(e){}
  lSpeak(LP.idx,tok); updatePlayer();
}
function lSpeak(i,tok){
  if(tok!==LP.token) return;
  const t=lTest(); if(!t){ LP.playing=false; return; }
  if(i>=t.script.length){ LP.playing=false; LP.idx=0; L.plays++; updatePlayer(); if(L.mode==='exam'&&!L.sub) toast('Bài nghe đã kết thúc — kiểm tra đáp án rồi bấm Nộp bài.'); return; }
  LP.idx=i; updatePlayer();
  const u=lUtter(t,t.script[i]); let done=false;
  const next=()=>{ if(done) return; done=true; if(tok!==LP.token||!LP.playing) return; setTimeout(()=>lSpeak(i+1,tok), 450); };
  u.onend=next; u.onerror=next;
  try{ speechSynthesis.speak(u); }catch(e){ next(); }
}
function lPause(){ LP.playing=false; LP.token++; try{ speechSynthesis.cancel(); }catch(e){} updatePlayer(); }
function lStopAudio(){ LP.playing=false; LP.token++; LP.idx=0; try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
function lRestart(){ lPause(); LP.idx=0; lPlay(); }
function lSkip(d){ const t=lTest(); const was=LP.playing; lPause(); LP.idx=Math.max(0,Math.min(t.script.length-1,LP.idx+d)); if(was) lPlay(); else updatePlayer(); }
function lSayLines(idxs){
  lPause(); const t=lTest(); const tok=++LP.token; let k=0;
  const nxt=()=>{ if(tok!==LP.token||k>=idxs.length) return; const u=lUtter(t,t.script[idxs[k++]]); u.onend=()=>setTimeout(nxt,300); u.onerror=()=>{}; try{ speechSynthesis.speak(u); }catch(e){} };
  nxt();
}

    ${!exam?`<button class="btn ghost" onclick="lRestart()">⟲ Nghe lại từ đầu</button><button class="btn ghost sm" onclick="lSkip(-1)" aria-label="Câu trước">«</button><button class="btn ghost sm" onclick="lSkip(1)" aria-label="Câu sau">»</button>`:''}

  const t=rTest(); const items=allItems(t.groups);
  const passage=Object.keys(t.paras).map(p=>`<p id="rp-${p}"><span class="pl">${p}</span>${t.paras[p].map((s,i)=>`<span class="s ${R.hl===p+'-'+(i+1)?'hl':''}" id="rs-${p}-${i+1}">${esc(s[0])}</span>`).join(' ')}${R.sub&&R.showVi?`<span class="vi-block">${t.paras[p].map(s=>esc(s[1])).join(' ')}</span>`:''}</p>`).join('');
  return `<button class="back" onclick="rStopTimer();R.view='list';render()">${I.back} Danh sách bài đọc</button>
  <div class="card" style="margin-bottom:12px"><div class="row">
    <div style="flex:1;min-width:200px"><span class="chip blue">${esc(t.level)}</span> <span class="chip">${items.length} câu</span><h2 style="margin:8px 0 0">${esc(t.title)}</h2></div>
    ${R.sub?`<span class="chip">⏱ ${fmtT(R.used)}</span>`:`<div style="text-align:right"><div class="tnum" id="rTimer" style="font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums">${fmtT((Date.now()-R.t0)/1000)}</div><div class="muted tiny">gợi ý ${t.minutes} phút</div></div>`}
  </div></div>
  ${R.sub?scoreCard(R.result,'R',`· thời gian ${fmtT(R.used)}`):''}
  <div class="tabs mtabs"><button class="tab ${R.tab==='p'?'active':''}" onclick="rTab('p')">📄 Bài đọc</button><button class="tab ${R.tab==='q'?'active':''}" onclick="rTab('q')">❓ Câu hỏi (${items.length})</button></div>
  <div class="rsplit show-${R.tab}" id="rsplit">
    <div class="card passage passage-col">
      <div class="row" style="margin-bottom:8px"><h3 style="margin:0">${esc(t.title)}</h3><span class="spacer"></span>${R.sub?`<button class="btn sm ghost" onclick="R.showVi=!R.showVi;render()">${R.showVi?'Ẩn':'Hiện'} dịch nghĩa</button>`:''}</div>
      ${passage}
    </div>
    <div class="card q-col">
      ${renderGroups('R',t.groups,R.ans,R.sub)}
      ${!R.sub?`<div class="row"><span class="spacer"></span><button class="btn" onclick="rSubmit()">✔ Nộp bài</button></div>`
        :`<div class="row"><button class="btn ghost" onclick="openR('${t.id}')">↺ Làm lại</button><span class="spacer"></span><button class="btn" onclick="rNext()">Bài tiếp theo →</button></div>`}
    </div>
  </div>`;
}
function rSubmit(){
  const t=rTest(); const items=allItems(t.groups);
  const blank=items.filter(({it})=>!String(R.ans[it.n]||'').trim()).length;
  if(blank && !R.confirm){ R.confirm=true; toast(`Còn ${blank} câu trống — bấm “Nộp bài” lần nữa để nộp.`); return; }
  rStopTimer(); R.used=Math.round((Date.now()-R.t0)/1000);
  const correct=items.filter(({it})=>isRight(it,R.ans[it.n])).length;
  const res=Object.assign({correct,total:items.length}, rawToBand(correct,items.length,'R'));
  R.result=res; R.sub=true; R.tab='q';
  const today=dkey();
  S.reading.history.push({id:'r'+Date.now(), tid:t.id, date:today, correct, total:items.length, band:res.band, seconds:R.used});
  S.scores.reading.push({band:res.band, date:today});
  logWrong('R',t.groups,R.ans,t.title);
  logAct('rea',1,Math.max(5,Math.round(R.used/60)));
  render(); window.scrollTo(0,0);
}
function rNext(){ const i=READING_TESTS.findIndex(t=>t.id===R.id); openR(READING_TESTS[(i+1)%READING_TESTS.length].id); }

/* =====================================================================
   BOOT
   ===================================================================== */
indexWords();
buildNav();
const local=loadLocal(); if(local) S=local;
applySettings();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.settings.theme==='auto') applySettings(); }); }catch(e){}
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
window.addEventListener('hashchange',onRoute);
setSaveStatus('init');
onRoute();
initCloud();
initAI();
initDictation();
</script>
